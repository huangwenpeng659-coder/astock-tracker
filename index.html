<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--card:#131a29;--card2:#182135;--border:#1e2a42;
  --text:#e5edff;--sub:#7c8db5;--up:#ef4444;--down:#22c55e;
  --brand:#3b82f6;--gold:#f5b942;--purple:#8b5cf6;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:70px}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#101830,#0a0e17);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo span{color:var(--brand)}
.sub{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:56px;z-index:9;
  background:rgba(10,14,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:20px;background:var(--card);color:var(--sub);white-space:nowrap;font-size:13px;border:1px solid transparent;transition:.2s;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-color:#3b82f6}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card-title .t{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.idx{background:var(--card2);border-radius:12px;padding:12px;border:1px solid var(--border)}
.idx .n{font-size:12px;color:var(--sub);margin-bottom:6px}
.idx .p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.idx .c{font-size:12px;margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(30,42,66,.5)}
.row:last-child{border-bottom:none}
.rank{width:22px;height:22px;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub)}
.rank.top{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff}
.stock-name{font-weight:600}
.stock-code{font-size:11px;color:var(--sub);margin-top:2px}
.badge{padding:2px 9px;border-radius:8px;font-size:11px;font-weight:600}
.badge.buy{background:rgba(239,68,68,.15);color:#ff6b6b;border:1px solid rgba(239,68,68,.3)}
.badge.watch{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.badge.risk{background:rgba(245,185,66,.15);color:var(--gold);border:1px solid rgba(245,185,66,.3)}
.score{font-size:18px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.score-l{font-size:10px;color:var(--sub);text-align:center}
.progress{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.plan{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.plan span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--sub)}
.plan span b{font-weight:600}
#kline{width:100%;height:260px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--sub);margin-top:3px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,30,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:20}
.tabbar div{flex:1;text-align:center;color:var(--sub);font-size:10px;padding:4px 0;cursor:pointer}
.tabbar div.active{color:var(--brand)}
.tabbar .ic{font-size:19px;display:block;margin-bottom:2px}
.notice{font-size:11px;color:var(--sub);text-align:center;padding:14px;line-height:1.6}
.loading{text-align:center;padding:40px;color:var(--sub)}
.limitup-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.limitup-kpi{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.limitup-kpi .value{font-size:18px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.limitup-kpi .label{font-size:10px;color:var(--sub);margin-top:3px}
.limitup-theme{border-left:3px solid var(--up);padding:10px}
.limitup-theme>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.limitup-theme>summary::-webkit-details-marker{display:none}
.limitup-theme-title{font-weight:700}
.limitup-table-wrap{overflow-x:auto;margin-top:8px}
.limitup-table{width:100%;min-width:760px;border-collapse:collapse;font-size:11px}
.limitup-table th,.limitup-table td{padding:7px 6px;border-bottom:1px solid rgba(30,42,66,.65);text-align:right;white-space:nowrap}
.limitup-table th{color:var(--sub);font-weight:500}
.limitup-table th:nth-child(2),.limitup-table td:nth-child(2),.limitup-table th:last-child,.limitup-table td:last-child{text-align:left}
.limitup-table tr:last-child td{border-bottom:none}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.install-btn{display:none;background:linear-gradient(135deg,#2563eb,#8b5cf6);color:#fff;border:none;
  border-radius:14px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;
  box-shadow:0 2px 10px rgba(59,130,246,.35);white-space:nowrap}
.install-btn:active{transform:scale(.95)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:100;display:flex;
  align-items:center;justify-content:center;padding:24px}
.guide{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px;
  max-width:340px;width:100%;line-height:1.9;font-size:14px}
.guide h3{font-size:16px;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">📊 A股<span>埋伏追踪</span></div>
    <div class="sub">价格低位 · 企稳吸筹 · 启动确认</div>
  </div>
  <div class="hdr-right">
    <button id="install-btn" class="install-btn" onclick="installApp()">📲 安装到桌面</button>
    <div class="sub" id="clock"></div>
  </div>
</header>

<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>

<script>
const SUPABASE_URL = 'https://iysjcbrximwjpzprixgp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LpBmLforAdtG7CWW2e9BbQ_WgV7SsyW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let cur = 'radar';
let klineChart = null;
let candidates = [];
let selectedStock = null;
let dailySignals = {limitUp:[], steadyRise:[], dates:{}};
let conceptMap = {};
let lastRun = null;
let watchlist = [];
let watchScores = {};
let tSignals = {};
let limitupRecap = null;

function fmt(v,d=2){return Number(v).toFixed(d)}

// jsonb 列在 Supabase 返回时已是对象/数组，直接 JSON.parse 会抛错
function safeParse(v, fallback){
  if(v===null||v===undefined) return fallback;
  if(typeof v==='object') return v;
  try{ return JSON.parse(v); }catch(e){ return fallback; }
}

const VIEWS = [
  {id:'radar',name:'机会雷达',icon:'🎯'},
  {id:'limitup',name:'涨停复盘',icon:'📑'},
  {id:'dip',name:'低吸机会',icon:'🎣'},
  {id:'watchlist',name:'自选股',icon:'⭐'},
  {id:'tsignals',name:'做T信号',icon:'🔄'},
  {id:'analysis',name:'个股分析',icon:'📈'},
  {id:'review',name:'策略复盘',icon:'📊'},
  {id:'backtest',name:'回测验证',icon:'🧪'},
  {id:'settings',name:'选股设置',icon:'⚙️'},
];

async function loadCandidates(){
  const {data:dateRows}=await sb.from('candidates')
    .select('trade_date')
    .order('trade_date',{ascending:false})
    .limit(1);
  if(!dateRows||!dateRows.length) return [];
  const latest=dateRows[0].trade_date;
  const {data,error} = await sb.from('candidates')
    .select('*')
    .eq('trade_date',latest)
    .order('score',{ascending:false})
    .limit(20);
  if(error){console.error('加载候选失败:',error);return [];}
  return data||[];
}

async function loadSignals(){
  try{
    const types=[['涨停','limitUp'],['放量上涨','steadyRise']];
    for(const [type,key] of types){
      const {data:dateRows}=await sb.from('daily_signals')
        .select('trade_date').eq('signal_type',type)
        .order('trade_date',{ascending:false}).limit(1);
      if(!dateRows||!dateRows.length){ dailySignals[key]=[]; dailySignals.dates[key]=null; continue; }
      const latest=dateRows[0].trade_date;
      const {data}=await sb.from('daily_signals').select('*')
        .eq('signal_type',type).eq('trade_date',latest);
      dailySignals[key]=data||[];
      dailySignals.dates[key]=latest;
    }
  }catch(e){console.error('加载信号失败:',e);}
}

let volCheck = null;

async function loadVolCheck(){
  try{
    const {data}=await sb.from('config').select('value').eq('key','volume_last_check').limit(1);
    if(data&&data.length) volCheck=safeParse(data[0].value,null);
  }catch(e){console.error('加载放量检测状态失败:',e);}
}

async function loadLimitupRecap(){
  try{
    const {data,error}=await sb.from('config').select('value').eq('key','limitup_recap:latest').limit(1);
    if(error){console.error('加载涨停复盘失败:',error);return;}
    limitupRecap=data&&data.length?safeParse(data[0].value,null):null;
  }catch(e){console.error('加载涨停复盘失败:',e);}
}

function todayStr(){
  return new Date().toLocaleDateString('sv-SE');
}

function signalDateLabel(d){
  if(!d) return '';
  return d===todayStr()?`${d} · 今日`:`${d} · 非当日`;
}

async function loadKline(code){
  const {data,error} = await sb.from('daily_kline')
    .select('*')
    .eq('code',code)
    .order('trade_date',{ascending:false})
    .limit(60);
  if(error){console.error('加载K线失败:',error);return [];}
  return (data||[]).reverse();
}

function renderRadar(){
  // 涨停板区
  let luHtml='';
  if(dailySignals.limitUp.length){
    const luDate=signalDateLabel(dailySignals.dates.limitUp);
    const stale=dailySignals.dates.limitUp!==todayStr();
    const luItems=dailySignals.limitUp.map(s=>{
      const d=s.details||{};
      return `<div class="row"><div><div class="stock-name">${s.name||s.code}(${s.code})</div></div><div class="up" style="font-weight:600">${fmt(s.price)} +${fmt(d.pct||0)}%</div></div>`;
    }).join('');
    luHtml=`<div class="card" style="border-color:rgba(239,68,68,.4)">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--up);box-shadow:0 0 8px var(--up)"></span>涨停板${stale?'（最近信号日）':''}</div><span class="badge buy">${dailySignals.limitUp.length}只 · ${luDate}</span></div>${luItems}${stale?`<div class="sub" style="font-size:11px;margin-top:8px">今天沪深300 内暂无涨停，以上为最近一个有涨停的交易日</div>`:''}</div>`;
  }
  // 放量上涨区
  let srHtml='';
  if(dailySignals.steadyRise.length){
    const srDate=signalDateLabel(dailySignals.dates.steadyRise);
    const srItems=dailySignals.steadyRise.map(s=>{
      const d=s.details||{};
      return `<div class="row"><div><div class="stock-name">${s.name||s.code}(${s.code})</div><div class="stock-code">三日连阳放量</div></div><div class="up" style="font-weight:600">3日 +${fmt(d.total_pct||0)}%</div></div>`;
    }).join('');
    srHtml=`<div class="card" style="border-color:rgba(59,130,246,.4)">
      <div class="card-title"><div class="t"><span class="dot"></span>三日稳步放量上涨</div><span class="badge watch">${dailySignals.steadyRise.length}只 · ${srDate}</span></div>${srItems}</div>`;
  }
  // 候选列表
  const noData=!candidates.length&&!dailySignals.limitUp.length&&!dailySignals.steadyRise.length;
  if(noData) return `<div class="loading">暂无候选股票数据<br><span class="sub">等待交易日选股脚本运行后刷新</span></div>`;
  const items = candidates.map((c,i)=>{
    const pct = c.last_price && c.launch_point ? ((c.last_price-c.launch_point)/c.launch_point*100) : 0;
    const t = tSignals[c.code] ? normalizeTData(tSignals[c.code]) : null;
    const tBadge = t ? `<span class="badge" style="background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)">做T ${t.advice}</span>` : '';
    return `
    <div class="card" onclick="selectStock('${c.code}');go('analysis')" style="cursor:pointer">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="rank ${i<3?'top':''}">${i+1}</div>
          <div>
            <div class="stock-name">${c.name||c.code}(${c.code}) <span class="badge buy">埋伏</span> ${tBadge}</div>
            <div class="stock-code">入场 ${fmt(c.launch_point)} · 止损 ${fmt(c.stop_loss)}</div>
          </div>
        </div>
        <div style="text-align:center">
          <div class="score">${fmt(c.score,0)}</div>
          <div class="score-l">质量分</div>
        </div>
      </div>
      <div class="progress"><i style="width:${Math.min(c.score,100)}%"></i></div>
      <div class="plan">
        <span>现价 <b class="${pct>=0?'up':'down'}">${fmt(c.last_price)}</b></span>
        <span>目标1 <b class="up">${fmt(c.target_1)}</b></span>
        <span>目标2 <b class="up">${fmt(c.target_2)}</b></span>
        <span>目标3 <b class="up">${fmt(c.target_3)}</b></span>
      </div>
    </div>`;}).join('');
  const candidateHtml=candidates.length?`<div class="card-title" style="padding:4px 4px 12px"><div class="t"><span class="dot"></span>启动形态候选 · Top ${candidates.length}</div><span class="sub">埋伏信号</span></div>${items}`:'';
  return `${luHtml}${srHtml}${candidateHtml}
  <div class="notice">⚠️ 本工具仅供历史数据研究，不构成投资建议</div>`;
}

function renderAnalysis(){
  const c = selectedStock || candidates[0];
  if(!c) return `<div class="loading">请先从机会雷达或做T信号页选择一只股票</div>`;
  const plan = c.launch_point ? `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>交易计划</div></div>
      <div class="row"><span class="sub">入场点</span><b>${fmt(c.launch_point)}</b></div>
      <div class="row"><span class="sub">止损位</span><b class="down">${fmt(c.stop_loss)}</b></div>
      <div class="row"><span class="sub">目标位1 (+5%)</span><b class="up">${fmt(c.target_1)}</b></div>
      <div class="row"><span class="sub">目标位2 (+10%)</span><b class="up">${fmt(c.target_2)}</b></div>
      <div class="row"><span class="sub">目标位3 (+15%)</span><b class="up">${fmt(c.target_3)}</b></div>
    </div>` : '';
  const score = c.score!=null ? `<div style="text-align:right"><div class="score">${fmt(c.score,0)}</div><div class="score-l">质量分</div></div>` : '';
  const price = c.last_price!=null ? `<div class="up" style="font-size:26px;font-weight:700">${fmt(c.last_price)}</div>` : '<div class="sub">该股票非当日候选，无埋伏计划</div>';
  return `
    <div class="card">
      <div class="card-title">
        <div class="t"><span class="dot"></span>${c.name||c.code}(${c.code})</div>
        ${c.launch_point?'<span class="badge buy">埋伏信号</span>':''}
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        ${price}
        ${score}
      </div>
      <div style="margin-bottom:8px">${getConcepts(c.code)}</div>
      <div id="kline"></div>
    </div>
    ${plan}
    <div id="t-strategy-area"><div class="loading">加载做T分析...</div></div>`;
}

async function initKline(){
  const c = selectedStock || candidates[0];
  if(!c) return;
  const el = document.getElementById('kline');
  if(!el||!window.echarts) return;
  if(klineChart){klineChart.dispose();}
  klineChart = echarts.init(el);
  klineChart.showLoading({text:'加载K线...',color:'#3b82f6',textColor:'#7c8db5',maskColor:'rgba(10,14,23,0.8)'});
  const kdata = await loadKline(c.code);
  klineChart.hideLoading();
  if(!kdata.length){klineChart.setOption({title:{text:'暂无K线数据',left:'center',top:'center',textStyle:{color:'#7c8db5',fontSize:13}}});return;}
  const dates = kdata.map(k=>k.trade_date.slice(5));
  const ohlc = kdata.map(k=>[k.open,k.close,k.low,k.high]);

  // 交易计划水平线：入场 / 止损 / 目标1-3
  const planLines = [];
  const planMarks = [];
  if(c.launch_point){
    planLines.push({yAxis:c.launch_point,lineStyle:{color:'#3b82f6',type:'solid',width:1.5},label:{show:true,position:'insideEndTop',formatter:'入场 '+c.launch_point,color:'#3b82f6',fontSize:10}});
  }
  if(c.stop_loss){
    planLines.push({yAxis:c.stop_loss,lineStyle:{color:'#22c55e',type:'dashed',width:1.5},label:{show:true,position:'insideEndTop',formatter:'止损 '+c.stop_loss,color:'#22c55e',fontSize:10}});
  }
  [[c.target_1,'#f59e0b','目标1'],[c.target_2,'#f97316','目标2'],[c.target_3,'#ef4444','目标3']].forEach(([v,color,name])=>{
    if(v) planLines.push({yAxis:v,lineStyle:{color:color,type:'dashed',width:1},label:{show:true,position:'insideEndTop',formatter:name+' '+v,color:color,fontSize:10}});
  });

  klineChart.setOption({
    backgroundColor:'transparent',
    grid:{left:52,right:12,top:30,bottom:44},
    axisPointer:{link:[{xAxisIndex:'all'}],label:{backgroundColor:'#1e3a8a',color:'#e5edff',fontSize:10}},
    tooltip:{
      trigger:'axis',
      axisPointer:{type:'cross',crossStyle:{color:'#7c8db5'},lineStyle:{color:'#7c8db5',type:'dashed'}},
      backgroundColor:'#131a29',borderColor:'#1e2a42',textStyle:{color:'#e5edff',fontSize:11},
      formatter:function(params){
        const k=params.find(p=>p.seriesType==='candlestick');
        if(!k) return '';
        const d=k.data;
        const pct=((d[1]-d[0])/d[0]*100).toFixed(2);
        return `<b>${k.name}</b><br>开 ${d[0]}<br>收 ${d[1]}<br>低 ${d[2]}<br>高 ${d[3]}<br>涨跌 ${pct}%`;
      }
    },
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#1e2a42'}},axisLabel:{color:'#7c8db5',fontSize:10,interval: Math.floor(dates.length/6)}},
    yAxis:{scale:true,axisLine:{lineStyle:{color:'#1e2a42'}},axisLabel:{color:'#7c8db5',fontSize:10},splitLine:{lineStyle:{color:'#131a29'}}},
    dataZoom:[{type:'inside',xAxisIndex:0,start:30,end:100}],
    series:[{
      type:'candlestick',data:ohlc,
      itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'},
      markLine:{symbol:'none',animation:false,data:planLines}
    }]
  });
}

// ============ 做T分析 ============

let tMinChart = null;

// 历史数据的VWAP曾因单位错误（成交额元/成交量手）放大100倍，这里做兼容换算
function normalizeTData(ts){
  const signals=safeParse(ts.signals,[]);
  const leaders=safeParse(ts.leaders,[]);
  const minKline=safeParse(ts.min_kline,[]);
  if(!Array.isArray(signals)) signals.length=0;
  if(!Array.isArray(leaders)) leaders.length=0;
  if(!Array.isArray(minKline)) minKline.length=0;
  if(!minKline.length) return {signals,leaders,minKline,vwap:ts.vwap,vwapSeries:[],advice:ts.advice,confidence:ts.confidence};

  const closes=minKline.map(k=>k.c);
  const highs=minKline.map(k=>k.h);
  const lows=minKline.map(k=>k.l);
  const vols=minKline.map(k=>k.v);
  const maxP=Math.max(...highs), minP=Math.min(...lows);

  // 用典型价×成交量累计回归VWAP（成交额缺失时的近似）
  let cumPV=0,cumV=0;
  const proxy=minKline.map(k=>{
    const tp=((k.h||k.c)+(k.l||k.c)+(k.c||0))/3;
    cumPV+=(tp||0)*(k.v||0); cumV+=(k.v||0);
    return cumV>0?cumPV/cumV:null;
  });

  const storedSeries=minKline.map(k=>k.vwap);
  const storedSane=storedSeries.every(v=>v==null||(v>=minP*0.7&&v<=maxP*1.3));
  let vwapSeries=storedSane?storedSeries:proxy;
  let vwap=storedSane?ts.vwap:(proxy[proxy.length-1]||ts.vwap);

  let outSignals=signals;
  if(!storedSane){
    // 旧数据：丢弃基于错误VWAP的信号，用换算后的VWAP重算
    outSignals=signals.filter(s=>s.indicator!=='VWAP').slice();
    const start=Math.max(1,minKline.length-6);
    for(let i=start;i<minKline.length;i++){
      const vw=vwapSeries[i], c=closes[i];
      if(!vw||!c) continue;
      const dev=(c-vw)/vw*100;
      if(dev<-0.5) outSignals.push({time:minKline[i].t,type:'买入',reason:`价格低于VWAP ${Math.abs(dev).toFixed(1)}%`,indicator:'VWAP'});
      else if(dev>0.5) outSignals.push({time:minKline[i].t,type:'卖出',reason:`价格高于VWAP ${dev.toFixed(1)}%`,indicator:'VWAP'});
    }
  }

  const buys=outSignals.filter(s=>s.type==='买入');
  const sells=outSignals.filter(s=>s.type==='卖出');
  // 按共振指标数计，避免同一指标多根K线重复计数抬高置信度
  const buyCount=new Set(buys.map(s=>s.indicator)).size;
  const sellCount=new Set(sells.map(s=>s.indicator)).size;
  let advice=ts.advice,confidence=ts.confidence;
  if(!storedSane){
    if(buyCount>=3){advice='建议做T买入';confidence='高';}
    else if(buyCount>=2){advice='可考虑做T买入';confidence='中';}
    else if(sellCount>=3){advice='建议做T卖出';confidence='高';}
    else if(sellCount>=2){advice='可考虑做T卖出';confidence='中';}
    else if(buyCount>0&&sellCount>0){advice='信号矛盾，建议观望';confidence='低';}
    else{advice='信号不足，继续观察';confidence='低';}
  }
  return {signals:outSignals,leaders,minKline,vwap,vwapSeries,advice,confidence};
}

function mergeTExtra(t){
  const ex=tExtra[t.code];
  if(!ex) return t;
  const merged=Object.assign({},t);
  ['period','plan','buy_score','sell_score','concepts'].forEach(k=>{
    if(ex[k]!==undefined&&ex[k]!==null) merged[k]=ex[k];
  });
  return merged;
}

async function loadTStrategy(code){
  const {data,error}=await sb.from('t_strategy').select('*').eq('code',code).order('trade_date',{ascending:false}).limit(1);
  if(error){console.error('读取做T数据失败:',error);return null;}
  const row=(data&&data[0])||null;
  return row?mergeTExtra(row):null;
}

// 取任意一条最新的做T数据（用于当前股票无数据时回退展示）
function latestTStrategy(){
  const keys=Object.keys(tSignals);
  if(!keys.length) return null;
  let best=null;
  keys.forEach(k=>{ if(!best || (tSignals[k].trade_date||'')>(best.trade_date||'')) best=tSignals[k]; });
  return best;
}

let trackingData = [];
let trackingFilter = 'all';

async function loadTracking(){
  try{
    const {data}=await sb.from('candidate_tracking').select('*').order('select_date',{ascending:false}).limit(200);
    trackingData=data||[];
  }catch(e){trackingData=[];}
}

function pctCell(val,label){
  if(val==null) return `<div class="stat"><div class="v" style="color:var(--sub)">--</div><div class="l">${label}</div></div>`;
  const c=val>=0?'var(--up)':'var(--down)';
  return `<div class="stat"><div class="v" style="color:${c}">${val>=0?'+':''}${val.toFixed(2)}%</div><div class="l">${label}</div></div>`;
}

function renderReview(){
  const filtered=trackingFilter==='all'?trackingData:trackingData.filter(t=>t.status===trackingFilter);
  const completed=trackingData.filter(t=>t.pct_5d!=null);
  const c10=trackingData.filter(t=>t.pct_10d!=null);
  const c20=trackingData.filter(t=>t.pct_20d!=null);
  const win5=completed.length?completed.filter(t=>t.pct_5d>0).length:0;
  const win10=c10.length?c10.filter(t=>t.pct_10d>0).length:0;
  const win20=c20.length?c20.filter(t=>t.pct_20d>0).length:0;
  const avg5=completed.length?(completed.reduce((s,t)=>s+t.pct_5d,0)/completed.length):0;
  const avg10=c10.length?(c10.reduce((s,t)=>s+t.pct_10d,0)/c10.length):0;
  const avg20=c20.length?(c20.reduce((s,t)=>s+t.pct_20d,0)/c20.length):0;
  const maxG=trackingData.length?Math.max(...trackingData.map(t=>t.max_gain||0)):0;
  const maxL=trackingData.length?Math.min(...trackingData.map(t=>t.max_loss||0)):0;

  // 表现分组：以最长的已有周期为准（20日 > 10日 > 5日 > 当前）
  const perfOf=(t)=>{
    if(t.pct_20d!=null) return {v:t.pct_20d,label:'20日'};
    if(t.pct_10d!=null) return {v:t.pct_10d,label:'10日'};
    if(t.pct_5d!=null) return {v:t.pct_5d,label:'5日'};
    return {v:t.pct_change||0,label:'当前'};
  };
  const good=[],bad=[],mid=[];
  filtered.forEach(t=>{
    const p=perfOf(t);
    if(t.hit_stop || p.v<=-5) bad.push({t,p});
    else if(p.v>=5) good.push({t,p});
    else mid.push({t,p});
  });
  good.sort((a,b)=>b.p.v-a.p.v);
  bad.sort((a,b)=>a.p.v-b.p.v);

  const filterBtns=['all','追踪中','已完成'].map(f=>
    `<span class="tab ${trackingFilter===f?'active':''}" onclick="trackingFilter='${f}';render()" style="font-size:12px;padding:5px 12px">${f==='all'?'全部':f}</span>`
  ).join('');

  const statusTag=(t)=>{
    if(t.hit_stop) return '<span class="badge risk">触及止损</span>';
    if(t.hit_target>=3) return '<span class="badge buy">达目标3</span>';
    if(t.hit_target>=2) return '<span class="badge buy">达目标2</span>';
    if(t.hit_target>=1) return '<span class="badge watch">达目标1</span>';
    if(t.status==='已完成') return '<span class="badge" style="background:var(--card2);color:var(--sub);border:1px solid var(--border)">已完成</span>';
    return '<span class="badge watch">追踪中</span>';
  };

  const card=(o)=>{
    const t=o.t, p=o.p;
    const pct=t.pct_change||0;
    const pc=pct>=0?'up':'down';
    const gcol=p.v>=5?'var(--up)':p.v<=-5?'var(--down)':'var(--sub)';
    return `<div class="card" style="border-left:3px solid ${p.v>=5?'var(--up)':p.v<=-5?'var(--down)':'var(--border)'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name">${t.name||t.code} <span class="stock-code">${t.code}</span></div>
          <div class="stock-code">入选 ${t.select_date} · 分数 ${t.select_score} · ${p.label} <b style="color:${gcol}">${p.v>=0?'+':''}${p.v.toFixed(2)}%</b></div>
          <div style="margin-top:4px">${getConcepts(t.code)}</div>
        </div>
        <div style="text-align:right">
          <div class="${pc}" style="font-size:18px;font-weight:700">${pct>=0?'+':''}${pct.toFixed(2)}%</div>
          ${statusTag(t)}
        </div>
      </div>
      <div class="stat-grid" style="margin-top:10px">
        ${pctCell(t.pct_5d,'5日')}
        ${pctCell(t.pct_10d,'10日')}
        ${pctCell(t.pct_20d,'20日')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--sub)">
        <span>入选价 ${fmt(t.select_price)} → 当前 ${fmt(t.current_price)}</span>
        <span>最大涨 <b class="up">${(t.max_gain||0).toFixed(1)}%</b> 最大跌 <b class="down">${(t.max_loss||0).toFixed(1)}%</b></span>
      </div>
    </div>`;};

  const group=(title,list,color,tip)=>{
    if(!list.length) return '';
    return `<div class="card" style="border-color:${color}">
      <div class="card-title"><div class="t"><span class="dot" style="background:${color}"></span>${title}</div><span class="sub">${list.length} 只</span></div>
      <div class="sub" style="margin-bottom:8px">${tip}</div>
      ${list.map(card).join('')}
    </div>`;};

  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>策略效果统计</div><span class="sub">共${trackingData.length}只</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${completed.length?Math.round(win5/completed.length*100):0}%</div><div class="l">5日胜率(${win5}/${completed.length})</div></div>
        <div class="stat"><div class="v">${c10.length?Math.round(win10/c10.length*100):0}%</div><div class="l">10日胜率(${win10}/${c10.length})</div></div>
        <div class="stat"><div class="v">${c20.length?Math.round(win20/c20.length*100):0}%</div><div class="l">20日胜率(${win20}/${c20.length})</div></div>
      </div>
      <div class="stat-grid" style="margin-top:8px">
        <div class="stat"><div class="v ${avg5>=0?'up':'down'}">${avg5>=0?'+':''}${avg5.toFixed(2)}%</div><div class="l">平均5日</div></div>
        <div class="stat"><div class="v ${avg10>=0?'up':'down'}">${avg10>=0?'+':''}${avg10.toFixed(2)}%</div><div class="l">平均10日</div></div>
        <div class="stat"><div class="v ${avg20>=0?'up':'down'}">${avg20>=0?'+':''}${avg20.toFixed(2)}%</div><div class="l">平均20日</div></div>
      </div>
      <div class="stat-grid" style="margin-top:8px">
        <div class="stat"><div class="v up">+${maxG.toFixed(1)}%</div><div class="l">最大盈利</div></div>
        <div class="stat"><div class="v down">${maxL.toFixed(1)}%</div><div class="l">最大亏损</div></div>
        <div class="stat"><div class="v">${trackingData.filter(t=>t.status==='追踪中').length}</div><div class="l">追踪中</div></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">${filterBtns}</div>
    ${group('优质标的（涨幅 ≥ +5%）',good,'var(--up)','这些票验证了选股逻辑有效，可复盘它们的共同概念、量价特征')}
    ${group('劣质标的（跌幅 ≤ -5% 或触及止损）',bad,'var(--down)','这些票是策略失效样本，回看它们入选时的形态，用于收紧选股条件')}
    ${group('中性 / 观察中',mid,'var(--sub)','涨跌幅在 ±5% 之间，或尚未走完观察周期')}
    <div class="notice">⚠️ 复盘结论用于调整选股阈值与参数，仅供研究参考</div>`;
}

  let el=document.getElementById('toast');
  if(!el){
    el=document.createElement('div');
    el.id='toast';
    el.style.cssText='position:fixed;left:50%;bottom:96px;transform:translateX(-50%);'+
      'border-radius:10px;padding:10px 18px;font-size:13px;z-index:200;'+

    (data||[]).forEach(r=>{

async function loadConcepts(){
  try{
    const {data,error}=await sb.from('config').select('key,value').like('key','concepts:%');
    if(error){console.error('加载概念失败:',error);}
    else (data||[]).forEach(r=>{
      const code=(r.key||'').split(':')[1];
      const payload=safeParse(r.value,{});
      const v=payload&&payload.concepts?payload.concepts:[];
      if(code) conceptMap[code]=Array.isArray(v)?v:[];
    });
  }catch(e){console.error('加载概念失败:',e);}

  // config 被 RLS 锁住时，用 t_strategy.concepts 兜底（该表对 anon 可读）
  if(Object.keys(conceptMap).length) return;
  try{
    const {data}=await sb.from('t_strategy').select('code,concepts');
    (data||[]).forEach(r=>{
      if(!r.code||conceptMap[r.code]) return;
      const c=safeParse(r.concepts,[]);
      if(Array.isArray(c)&&c.length) conceptMap[r.code]=c;
    });
  }catch(e){console.error('加载概念(t_strategy)失败:',e);}
}

function getConcepts(code){

}

function recapText(value){
  return String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function recapNumber(value,digits=2){
  const n=Number(value);
  return Number.isFinite(n)?n.toFixed(digits):'--';
}

async function addWatchStock(){
  const inp=document.getElementById('wl-input');
  const btn=document.getElementById('wl-add');
  const val=(inp?.value||'').trim();
  if(!val){toast('请输入股票代码', true);return;}
  const code=val.replace(/[^0-9]/g,'');
  if(code.length!==6){toast('请输入6位股票代码', true);return;}
  if(btn&&btn.disabled) return;
  if(btn) btn.disabled=true;
  try{
    const {data:exist}=await sb.from('watchlist').select('id').eq('code',code).limit(1);
    if(exist&&exist.length){
      await loadWatchlist();
      render();
      setTimeout(()=>focusStockCard(code),80);
      toast(code+' 已在自选股中，已定位到该股票');
      return;
    }
    let name=val;
    const {data:stock}=await sb.from('stocks').select('name').eq('code',code).limit(1);
    if(stock&&stock.length&&stock[0].name) name=stock[0].name;
    const {error}=await sb.from('watchlist').insert({code,name});
    if(error) throw error;
    if(inp) inp.value='';
    await loadWatchlist();
    render();
    setTimeout(()=>focusStockCard(code),80);
    toast('已添加 '+code);
  }catch(e){
    toast('添加失败: '+(e.message||e), true);
  }finally{
    if(btn) btn.disabled=false;
  }
}

async function removeWatchStock(code){
  try{
    const {error}=await sb.from('watchlist').delete().eq('code',code);
    if(error) throw error;
    delete watchScores[code];
    await loadWatchlist();
    render();
    toast('已删除 '+code);
  }catch(e){
    toast('删除失败: '+(e.message||e), true);
  }
}

}

function selectStock(code){
  selectedStock = candidates.find(c=>c.code===code)||null;
  if(!selectedStock){
    const t = tSignals[code];
    const w = watchlist.find(x=>x.code===code);
    const s = watchScores[code];
    selectedStock = {code, name:(t&&t.name)||(w&&w.name)||(s&&s.name)||code,
      score:s?s.score:null, last_price:null,
      launch_point:null, stop_loss:null, target_1:null, target_2:null, target_3:null};
  }
}

  const buy = advice.includes('买入');
  const sell = advice.includes('卖出');
  const color = buy?'var(--up)':sell?'var(--down)':'var(--sub)';
  const bg = buy?'rgba(239,68,68,.15)':sell?'rgba(34,197,94,.15)':'rgba(124,141,181,.15)';
  const border = buy?'rgba(239,68,68,.3)':sell?'rgba(34,197,94,.3)':'rgba(124,141,181,.3)';
  return `<span class="badge" style="background:${bg};color:${color};border:1px solid ${border}">${advice}</span>`;
}

    let plan=t.plan;
    plan=safeParse(plan,null);
    return {code:t.code,name:t.name,trade_date:t.trade_date,industry:t.industry,
      advice:n.advice,confidence:n.confidence,vwap:n.vwap,signals:n.signals,
      period:t.period||'30',plan:plan,buy_score:t.buy_score||0,sell_score:t.sell_score||0};
  });
  const list=norm.sort((a,b)=>{
    const ba=(a.advice.includes('买入')?2:0)+(a.confidence==='高'?1:0);
    const bb=(b.advice.includes('买入')?2:0)+(b.confidence==='高'?1:0);
    return bb-ba;
  });
  if(!list.length){
    return `<div class="loading">暂无做T信号数据<br><span class="sub">等待交易日脚本运行后生成</span></div>`;
  }
  const items=list.map(t=>{
    const signals=t.signals||[];
    const buys=signals.filter(s=>s.type==='买入');
    const sells=signals.filter(s=>s.type==='卖出');
    const lastReason=(signals[signals.length-1]||{}).reason||'';
    return `<div class="card" onclick="selectStock('${t.code}');go('analysis')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name">${t.name||t.code} <span class="stock-code">${t.code}</span></div>
          <div class="stock-code">VWAP ${fmt(t.vwap)} · ${t.industry||'未知行业'} · ${t.period}分钟周期</div>
          <div style="margin-top:4px">${getConcepts(t.code)}</div>
        </div>
        <div style="text-align:right">
          ${tAdviceBadge(t.advice)}
          <div class="stock-code" style="margin-top:4px">置信度 ${t.confidence}</div>
        </div>
      </div>
      <div class="stat-grid" style="margin-top:10px">
        <div class="stat"><div class="v up">${t.buy_score}</div><div class="l">买入强度分</div></div>
        <div class="stat"><div class="v down">${t.sell_score}</div><div class="l">卖出强度分</div></div>
        <div class="stat"><div class="v" style="font-size:13px;color:var(--sub);line-height:1.5">${lastReason.slice(0,14)}</div><div class="l">最新信号</div></div>
      </div>
      ${t.plan&&t.plan.entry?`<div style="margin-top:8px;font-size:12px;color:var(--sub)">触发 <b style="color:var(--text)">${fmt(t.plan.entry)}</b> · 止损 <b class="down">${fmt(t.plan.stop)}</b> · 目标 <b class="up">${fmt(t.plan.target)}</b> · 仓位 ${t.plan.position||'-'}</div>`:''}
    </div>`;
  }).join('');
  return `
    <div class="card" style="border-color:rgba(139,92,246,.4)">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></span>日内做T信号</div><span class="badge" style="background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)">${list.length}只</span></div>
      <div class="sub">基于30分钟K线的VWAP/量能/MACD/KDJ/布林带/板块联动标准化信号（强=2分 中=1分，同向≥3分视为共振），点击卡片查看K线图与做T计划</div>
    </div>
    ${items}
    <div class="notice">⚠️ 日内做T仅供参考，注意仓位管理和交易成本</div>`;
}

const CONFIG_FIELDS = [
  {key:'min_change_pct',label:'启动涨幅阈值(%)',options:[{v:3,l:'3% (宽松)'},{v:5,l:'5% (适中)'},{v:7,l:'7% (默认)'},{v:9,l:'9% (严格)'}],def:7},
  {key:'volume_ratio',label:'量能倍数',options:[{v:1.5,l:'1.5倍'},{v:2,l:'2倍 (默认)'},{v:3,l:'3倍'}],def:2},
  {key:'shrink_ratio',label:'缩量比例',options:[{v:0.8,l:'80% (宽松)'},{v:0.6,l:'60% (默认)'},{v:0.5,l:'50% (严格)'}],def:0.6},
  {key:'pullback_tolerance',label:'回踩容忍度',options:[{v:0.95,l:'跌5% (宽松)'},{v:0.97,l:'跌3% (适中)'},{v:0.99,l:'跌1% (默认)'}],def:0.99},
  {key:'ma5_deviation',label:'MA5偏离度',options:[{v:0.08,l:'8% (宽松)'},{v:0.05,l:'5% (适中)'},{v:0.03,l:'3% (默认)'}],def:0.03},
  {key:'min_score',label:'最低入选分数',options:[{v:30,l:'30分'},{v:40,l:'40分'},{v:50,l:'50分'},{v:60,l:'60分 (默认)'},{v:70,l:'70分'}],def:60},
];
let currentConfig = {};

async function loadConfig(){
  try{
    const {data}=await sb.from('config').select('*').eq('key','thresholds');
    if(data&&data[0]&&data[0].value){
      const val=safeParse(data[0].value,null);
      return val;
    }
    return {};
  }catch(e){return {};}
}

async function saveConfig(){
  const cfg={};
  CONFIG_FIELDS.forEach(f=>{
    const el=document.getElementById('cfg_'+f.key);
    cfg[f.key]=el?parseFloat(el.value):f.def;
  });
  try{
    await sb.from('config').upsert({key:'thresholds',value:cfg},{onConflict:'key'}).select();
    currentConfig=cfg;
    document.getElementById('save-msg').textContent='保存成功！下次选股将使用新参数';
    document.getElementById('save-msg').style.color='var(--brand)';
    setTimeout(()=>{const m=document.getElementById('save-msg');if(m)m.textContent='';},3000);
  }catch(e){
    document.getElementById('save-msg').textContent='保存失败: '+e.message;
    document.getElementById('save-msg').style.color='var(--up)';
  }
}

function renderSettings(){
  const fields=CONFIG_FIELDS.map(f=>{
    const cur=currentConfig[f.key]!=null?currentConfig[f.key]:f.def;
    const opts=f.options.map(o=>`<option value="${o.v}" ${Number(cur)===Number(o.v)?'selected':''}>${o.l}</option>`).join('');
    return `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span class="sub" style="font-size:13px">${f.label}</span>
      <select id="cfg_${f.key}" style="background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;outline:none">${opts}</select>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>选股参数配置</div><span class="sub">调整后下次选股生效</span></div>
      ${fields}
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <button onclick="saveConfig()" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">保存配置</button>
        <span id="save-msg" style="font-size:12px"></span>
      </div>
    </div>
    <div class="notice">修改参数后需手动触发 GitHub Actions 或等待每日自动运行<br>参数越宽松，候选股票越多，但信号质量可能降低</div>`;
}

function btCell(c){
  if(!c||!c.n) return '<div class="sub">--</div>';
  const wr=c.win_rate>=50?'var(--up)':'var(--down)';
  return `<div class="stat"><div class="v ${c.avg>=0?'up':'down'}">${c.avg>=0?'+':''}${c.avg}%</div><div class="l">胜率 <b style="color:${wr}">${c.win_rate}%</b> · ${c.n}次</div></div>`;
}

function renderBacktest(){
  const t=backtestData['t_signal'];
  const s=backtestData['screening'];
  if(!t&&!s){
    return `<div class="loading">暂无回测数据<br><span class="sub">等待脚本运行后生成（需要先积累几天信号样本）</span></div>`;
  }

  const hLabel={h1:'后1根(30分钟)',h3:'后3根(1.5小时)',h6:'后6根(3小时)'};
  const sLabel={h5:'入选后5日',h10:'入选后10日',h20:'入选后20日'};

  let tHtml='<div class="sub">暂无做T信号回测数据</div>';
  if(t&&t.samples){
    const all=t.groups['全部']||{};
    const byInd=t.groups['指标']||{};
    const indRows=Object.entries(byInd).sort((a,b)=>(b[1].h3?.n||0)-(a[1].h3?.n||0)).map(([k,v])=>`
      <div class="card" style="background:var(--card2)">
        <div style="display:flex;justify-content:space-between"><b style="font-size:13px">${k}</b><span class="sub">${v.h3?`${v.h3.n}次` : (v.h1?`${v.h1.n}次`:'')}</span></div>
        <div class="stat-grid" style="margin-top:6px">
          ${btCell(v.h1)}${btCell(v.h3)}${btCell(v.h6)}
        </div>
      </div>`).join('');
    tHtml=`
      <div class="card" style="border-color:rgba(34,197,94,.35)">
        <div class="card-title"><div class="t"><span class="dot" style="background:var(--up)"></span>做T信号回测</div><span class="sub">${t.samples}个信号 · 成本${t.cost}%</span></div>
        <div class="sub" style="margin-bottom:8px">统计每个信号发出后，价格在 1/3/6 根30分钟K线内的净收益（已扣交易成本），胜率=扣除成本后方向正确占比</div>
        <div class="stat-grid">
          ${btCell(all.h1)}${btCell(all.h3)}${btCell(all.h6)}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><div class="t"><span class="dot"></span>分指标表现</div><span class="sub">看哪个指标最准</span></div>
        ${indRows||'<div class="sub">样本不足</div>'}
      </div>`;
  }

  let sHtml='<div class="sub">暂无选股回测数据</div>';
  if(s&&s.samples){
    const groups=s.groups||{};
    const keys=Object.keys(groups).filter(k=>k!=='全部');
    const rows=keys.map(k=>{
      const v=groups[k];
      return `<tr><td style="padding:6px 8px;font-size:12px">${k}</td>
        <td style="padding:6px 8px;text-align:right">${v.h5?v.h5.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h5&&v.h5.win_rate>=50?'var(--up)':'var(--down)'}">${v.h5?v.h5.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right">${v.h10?v.h10.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h10&&v.h10.win_rate>=50?'var(--up)':'var(--down)'}">${v.h10?v.h10.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right">${v.h20?v.h20.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h20&&v.h20.win_rate>=50?'var(--up)':'var(--down)'}">${v.h20?v.h20.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right" class="${v.h20&&v.h20.avg>=0?'up':'down'}">${v.h20?v.h20.avg+'%':'--'}</td></tr>`;
    }).join('');
    const all=groups['全部']||{};
    sHtml=`
      <div class="card" style="border-color:rgba(56,189,248,.35)">
        <div class="card-title"><div class="t"><span class="dot" style="background:#38bdf8"></span>选股策略回测</div><span class="sub">${s.samples}只 · 成本${s.cost}%</span></div>
        <div class="stat-grid">
          ${btCell(all.h5)}${btCell(all.h10)}${btCell(all.h20)}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><div class="t"><span class="dot"></span>分组表现</div><span class="sub">找出最优参数区间</span></div>
        <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="color:var(--sub);font-size:11px">
            <th style="text-align:left;padding:6px 8px">分组</th>
            <th style="text-align:right;padding:6px 8px">5日样本</th>
            <th style="text-align:right;padding:6px 8px">5日胜率</th>
            <th style="text-align:right;padding:6px 8px">10日样本</th>
            <th style="text-align:right;padding:6px 8px">10日胜率</th>
            <th style="text-align:right;padding:6px 8px">20日样本</th>
            <th style="text-align:right;padding:6px 8px">20日胜率</th>
            <th style="text-align:right;padding:6px 8px">20日均值</th>
          </tr></thead>
          <tbody>${rows||'<tr><td colspan="8" class="sub">样本不足</td></tr>'}</tbody>
        </table>
        </div>
        <div class="sub" style="margin-top:8px">分组维度：入选当日涨幅区间 / 评分区间 / 回踩天数 / 所属概念。样本 ≥20 的分组才可信。</div>
      </div>`;
  }

  return `
    ${tHtml}
    ${sHtml}
    <div class="notice">⚠️ 回测基于实际信号的前瞻统计，不含未来函数；样本量小于30时胜率波动很大，仅供调参参考</div>`;
}

function renderBanner(){
  if(!lastRun) return '';
  const stale=lastRun.stale;
  const bg=stale?'rgba(239,68,68,.12)':'rgba(34,197,94,.12)';
  const color=stale?'#ef4444':'#22c55e';
  const bd=stale?'rgba(239,68,68,.3)':'rgba(34,197,94,.3)';
  const candDate=(candidates&&candidates[0]&&candidates[0].trade_date)||lastRun.data_date;
  return `<div class="card" style="border-color:${bd};background:${bg}">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="font-size:13px">
        <b style="color:${color}">数据日期 ${lastRun.data_date||'未知'}</b>
        ${stale?`<span class="sub" style="margin-left:8px">⚠️ 行情源未更新到 ${lastRun.today}，页面数据可能仍是上一交易日的</span>`
               :`<span class="sub" style="margin-left:8px">已是最新</span>`}
      </div>
      <div class="sub">上次运行 ${lastRun.run_at||'-'} · 候选 ${lastRun.candidates||0} 只 · 抓取 ${lastRun.fetched||0}/${lastRun.pool||0}</div>
    </div>
  </div>`;
}

async function render(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  document.querySelectorAll('#tabbar div').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  const v = document.getElementById('view');
  const banner=renderBanner();
  if(cur==='radar') v.innerHTML = banner+renderRadar();
  else if(cur==='limitup') v.innerHTML = banner+renderLimitupRecap();
  else if(cur==='dip') v.innerHTML = banner+renderDip();
  else if(cur==='watchlist') v.innerHTML = banner+renderWatchlist();
  else if(cur==='tsignals') v.innerHTML = banner+renderTSignals();
  else if(cur==='analysis'){ v.innerHTML = banner+renderAnalysis(); setTimeout(initKline,50); setTimeout(renderTStrategy,200); }
  else if(cur==='review') v.innerHTML = banner+renderReview();
  else if(cur==='backtest') v.innerHTML = banner+renderBacktest();
  else if(cur==='settings') v.innerHTML = banner+renderSettings();
  window.scrollTo(0,0);
}
function go(id){
  cur=id;
  render();
  // 切回自选股时重新拉一次，避免看到打开页面时的旧快照
  if(id==='watchlist') Promise.all([loadWatchlist(),loadVolCheck()]).then(render);
}

let deferredPrompt = null;

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function syncInstallBtn(){
  const b = document.getElementById('install-btn');
  if(b) b.style.display = isStandalone() ? 'none' : 'inline-block';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'}).then(reg=>{
    reg.update();
    console.log('✓ Service Worker 已注册');
  }).catch(err=>console.error('Service Worker 注册失败:', err));
}

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  syncInstallBtn();
});

window.addEventListener('appinstalled', ()=>{
  deferredPrompt = null;
  syncInstallBtn();
});

async function installApp(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    const {outcome} = await deferredPrompt.userChoice;
    console.log('安装结果:', outcome);
    deferredPrompt = null;
    syncInstallBtn();
    return;
  }
  showInstallGuide();
}

function showInstallGuide(){
  const ua = navigator.userAgent;
  let steps;
  if(/iPhone|iPad|iPod/i.test(ua)){
    steps = '① 用 <b>Safari</b> 打开本页<br>② 点底部的「分享」按钮 🔗<br>③ 选择「<b>添加到主屏幕</b>」<br>④ 点右上角「添加」';
  }else if(/Android/i.test(ua)){
    steps = '① 点浏览器右上角「⋮」菜单<br>② 选择「<b>安装应用</b>」或「添加到主屏幕」<br>③ 确认安装';
  }else{
    steps = '① 用 <b>Chrome 或 Edge</b> 打开本页<br>② 点地址栏右侧的「安装」图标 ⊕<br>③ 或打开浏览器菜单 →「安装 A股埋伏追踪」<br><br><span style="color:#7c8db5;font-size:12px">Firefox 不支持安装 PWA</span>';
  }
  const mask = document.createElement('div');
  mask.className = 'mask';
  mask.innerHTML = `<div class="guide">
    <h3>📲 添加到桌面</h3>
    <div>${steps}</div>
    <div style="margin-top:16px;text-align:right">
      <button onclick="this.closest('.mask').remove()" style="background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 18px;font-size:14px;cursor:pointer">知道了</button>
    </div>
  </div>`;
  mask.onclick = e => { if(e.target === mask) mask.remove(); };
  document.body.appendChild(mask);
}

async function init(){
  syncInstallBtn();
  document.getElementById('tabs').innerHTML = VIEWS.map(v=>`<div class="tab" data-id="${v.id}" onclick="go('${v.id}')">${v.name}</div>`).join('');
  document.getElementById('tabbar').innerHTML = VIEWS.map(v=>`<div data-id="${v.id}" onclick="go('${v.id}')"><span class="ic">${v.icon}</span>${v.name}</div>`).join('');
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).slice(5,16);}
  setInterval(tick,1000);tick();
  document.getElementById('view').innerHTML='<div class="loading">正在加载数据...</div>';
  currentConfig = await loadConfig();
  await loadLastRun();
  await loadBacktest();
  await loadConcepts();
  await loadDip();
  await loadVolCheck();
  await loadLimitupRecap();
  await loadWatchlist();
  await loadTExtra();
  await loadTSignals();
  await loadTracking();
  await loadSignals();
  candidates = await loadCandidates();
  if(candidates.length) selectedStock = candidates[0];
  render();
  window.addEventListener('resize',()=>klineChart&&klineChart.resize());
}
init();
</script>
