// 历史数据的VWAP曾因单位错误（成交额元/成交量手）放大100倍，这里做兼容换算
function normalizeTData(ts){
  const signals=safeParse(ts.signals,[]);
  const leaders=safeParse(ts.leaders,[]);
  const minKline=safeParse(ts.min_kline,[]);
  if(!Array.isArray(signals)) signals.length=0;
  if(!Array.isArray(leaders)) leaders.length=0;
  if(!Array.isArray(minKline)) minKline.length=0;
  if(!minKline.length) return {signals,leaders,minKline,vwap:ts.vwap,vwapSeries:[],advice:ts.advice,confidence:ts.confidence};

  const closes=minKline.map(k=>k.c);
  const highs=minKline.map(k=>k.h);
  const lows=minKline.map(k=>k.l);
  const vols=minKline.map(k=>k.v);
  const maxP=Math.max(...highs), minP=Math.min(...lows);

  // 用典型价×成交量累计回归VWAP（成交额缺失时的近似）
  let cumPV=0,cumV=0;
  const proxy=minKline.map(k=>{
    const tp=((k.h||k.c)+(k.l||k.c)+(k.c||0))/3;
    cumPV+=(tp||0)*(k.v||0); cumV+=(k.v||0);
    return cumV>0?cumPV/cumV:null;
  });

  const storedSeries=minKline.map(k=>k.vwap);
  const storedSane=storedSeries.every(v=>v==null||(v>=minP*0.7&&v<=maxP*1.3));
  let vwapSeries=storedSane?storedSeries:proxy;
  let vwap=storedSane?ts.vwap:(proxy[proxy.length-1]||ts.vwap);

  let outSignals=signals;
  if(!storedSane){
    // 旧数据：丢弃基于错误VWAP的信号，用换算后的VWAP重算
    outSignals=signals.filter(s=>s.indicator!=='VWAP').slice();
    const start=Math.max(1,minKline.length-6);
    for(let i=start;i<minKline.length;i++){
      const vw=vwapSeries[i], c=closes[i];
      if(!vw||!c) continue;
      const dev=(c-vw)/vw*100;
      if(dev<-0.5) outSignals.push({time:minKline[i].t,type:'买入',reason:`价格低于VWAP ${Math.abs(dev).toFixed(1)}%`,indicator:'VWAP'});
      else if(dev>0.5) outSignals.push({time:minKline[i].t,type:'卖出',reason:`价格高于VWAP ${dev.toFixed(1)}%`,indicator:'VWAP'});
    }
  }

  const buys=outSignals.filter(s=>s.type==='买入');
  const sells=outSignals.filter(s=>s.type==='卖出');
  // 按共振指标数计，避免同一指标多根K线重复计数抬高置信度
  const buyCount=new Set(buys.map(s=>s.indicator)).size;
  const sellCount=new Set(sells.map(s=>s.indicator)).size;
  let advice=ts.advice,confidence=ts.confidence;
  if(!storedSane){
    if(buyCount>=3){advice='建议做T买入';confidence='高';}
    else if(buyCount>=2){advice='可考虑做T买入';confidence='中';}
    else if(sellCount>=3){advice='建议做T卖出';confidence='高';}
    else if(sellCount>=2){advice='可考虑做T卖出';confidence='中';}
    else if(buyCount>0&&sellCount>0){advice='信号矛盾，建议观望';confidence='低';}
    else{advice='信号不足，继续观察';confidence='低';}
  }
  return {signals:outSignals,leaders,minKline,vwap,vwapSeries,advice,confidence};
}

}

  const area = document.getElementById('t-strategy-area');
  if(!area) return;
  let ts = await loadTStrategy(c.code);
  let fallback=false;
  if(!ts){
    ts = latestTStrategy();
    fallback=true;
  }
  if(!ts){area.innerHTML=`<div class="card"><div class="card-title"><div class="t"><span class="dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></span>做T分析</div></div><div class="sub" style="text-align:center;padding:20px">暂无做T数据，将在下次脚本运行后生成<br>请确保该股票已加入<b>自选股</b>（脚本只对自选股生成做T分析）<br>若已有数据仍不显示，请检查 Supabase 的 t_strategy 表是否存在并已开启 anon 读取权限</div></div>`;return;}

  const {signals,leaders,minKline,vwap,vwapSeries,advice,confidence}=normalizeTData(ts);

  const advColor=advice.includes('买入')?'var(--up)':advice.includes('卖出')?'var(--down)':'var(--sub)';

  const strengthColor={'强':'var(--up)','中':'var(--gold)','弱':'var(--sub)'};
  const sigList=signals.slice(-12).map(s=>{
    const tc=s.type==='买入'?'up':'down';
    const st=s.strength||'';
    const stBadge=st?`<span class="badge" style="background:transparent;color:${strengthColor[st]||'var(--sub)'};border:1px solid ${strengthColor[st]||'var(--border)'};font-size:10px;padding:1px 6px">${st}</span>`:'';
    const val=(s.value!=null&&s.value!=='')?` <span class="sub">触发 ${s.value}${s.threshold?` / 阈值 ${s.threshold}`:''}</span>`:'';
    return `<div class="row" style="padding:6px 0;align-items:flex-start">
      <div style="min-width:92px"><span class="${tc}" style="font-weight:600">${s.type}</span> <span class="sub">${s.time||''}</span><div style="margin-top:2px">${stBadge} <span class="badge ${s.type==='买入'?'buy':'risk'}" style="font-size:10px">${s.indicator}</span></div></div>
      <div class="sub" style="flex:1">${s.reason}${val}</div></div>`;
  }).join('');

  let tplan=safeParse(ts.plan,null);
  const planCard=(tplan&&tplan.entry)?`<div class="card" style="border-color:rgba(250,204,21,.35)">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--gold)"></span>标准化做T计划</div><span class="sub">${ts.period||'30'}分钟周期</span></div>
      <div class="row"><span class="sub">触发价</span><b>${fmt(tplan.entry)}</b></div>
      <div class="row"><span class="sub">止损价</span><b class="down">${fmt(tplan.stop)}</b></div>
      <div class="row"><span class="sub">目标价(VWAP回归)</span><b class="up">${fmt(tplan.target)}</b></div>
      <div class="row"><span class="sub">建议仓位</span><b>${tplan.position||'-'}</b></div>
      <div class="row"><span class="sub">ATR(14)</span><b>${fmt(tplan.atr)}</b></div>
      ${tplan.note?`<div class="sub" style="margin-top:8px;padding:8px;background:var(--card2);border-radius:8px;font-size:12px">${tplan.note}</div>`:''}
    </div>`:'';

  const leaderList=leaders.map(l=>`<div class="row" style="padding:6px 0"><div class="stock-name">${l.name}(${l.code})</div><div class="${l.pct>=0?'up':'down'}" style="font-weight:600">${l.pct>=0?'+':''}${l.pct}%</div></div>`).join('');

  area.innerHTML=`
    ${fallback?`<div class="notice" style="margin-bottom:8px">当前股票 ${c.code} 无做T数据，以下展示的是自选股 <b>${ts.name||ts.code}(${ts.code})</b> 于 ${ts.trade_date} 的做T分析</div>`:''}
    <div class="card" style="border-color:rgba(139,92,246,.4)">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></span>做T综合建议 · ${ts.name||ts.code}(${ts.code})</div><span class="badge" style="background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)">置信度: ${confidence}</span></div>
      <div style="text-align:center;padding:12px 0">
        <div style="font-size:24px;font-weight:700;color:${advColor}">${advice}</div>
        <div class="sub" style="margin-top:4px">VWAP均价 ${fmt(vwap)} · 周期 ${ts.period||'30'}分钟 · 买分 ${ts.buy_score||0} / 卖分 ${ts.sell_score||0}</div>
        <div style="margin-top:6px">${getConcepts(ts.code)}</div>
      </div>
    </div>
    ${planCard}
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></span>${ts.period||'30'}分钟K线 + VWAP</div><span class="sub">黄线=分时均价VWAP，箭头=买卖信号</span></div>
      <div id="min-kline" style="width:100%;height:240px"></div>
    </div>
    ${leaders.length?`<div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>板块联动 · ${ts.industry||''}</div></div>
      ${leaderList}
      ${ts.leader_correlation?`<div class="sub" style="margin-top:8px;padding:8px;background:var(--card2);border-radius:8px;font-size:12px">${ts.leader_correlation}</div>`:''}
    </div>`:''}
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>做T信号明细</div><span class="sub">买${signals.filter(s=>s.type==='买入').length} 卖${signals.filter(s=>s.type==='卖出').length}</span></div>
      ${sigList||'<div class="sub" style="text-align:center;padding:12px">暂无信号</div>'}
    </div>
    <div class="notice">⚠️ 日内做T仅供参考，注意仓位管理和交易成本</div>`;

  // 画分时图
  if(minKline.length&&window.echarts){
    setTimeout(()=>{
      const el=document.getElementById('min-kline');
      if(!el)return;
      if(tMinChart)tMinChart.dispose();
      tMinChart=echarts.init(el);
      const times=minKline.map(k=>k.t);
      const closes=minKline.map(k=>k.c);
      const vwaps=vwapSeries;
      const vols=minKline.map(k=>k.v);
      // 信号标注
      const buyPts=signals.filter(s=>s.type==='买入').map(s=>{const idx=times.indexOf(s.time);return idx>=0?{coord:[idx,closes[idx]],symbol:'triangle',symbolSize:10,itemStyle:{color:'#22c55e'},label:{show:false}}:null;}).filter(Boolean);
      const sellPts=signals.filter(s=>s.type==='卖出').map(s=>{const idx=times.indexOf(s.time);return idx>=0?{coord:[idx,closes[idx]],symbol:'pin',symbolSize:10,symbolRotate:180,itemStyle:{color:'#ef4444'},label:{show:false}}:null;}).filter(Boolean);
      tMinChart.setOption({
        backgroundColor:'transparent',
        grid:[{left:45,right:10,top:10,bottom:'35%'},{left:45,right:10,top:'70%',bottom:30}],
        axisPointer:{link:[{xAxisIndex:'all'}],label:{backgroundColor:'#1e3a8a',color:'#e5edff',fontSize:10}},
        tooltip:{trigger:'axis',axisPointer:{type:'cross',crossStyle:{color:'#7c8db5'}},backgroundColor:'#131a29',borderColor:'#1e2a42',textStyle:{color:'#e5edff',fontSize:11}},
        xAxis:[{type:'category',data:times,gridIndex:0,axisLabel:{show:false},axisLine:{lineStyle:{color:'#1e2a42'}}},{type:'category',data:times,gridIndex:1,axisLabel:{color:'#7c8db5',fontSize:9,interval:Math.floor(times.length/5)},axisLine:{lineStyle:{color:'#1e2a42'}}}],
        yAxis:[{scale:true,gridIndex:0,axisLabel:{color:'#7c8db5',fontSize:10},splitLine:{lineStyle:{color:'#131a29'}},axisLine:{lineStyle:{color:'#1e2a42'}}},{gridIndex:1,axisLabel:{show:false},splitLine:{show:false},axisLine:{lineStyle:{color:'#1e2a42'}}}],
        series:[
          {name:'价格',type:'line',data:closes,xAxisIndex:0,yAxisIndex:0,lineStyle:{color:'#3b82f6',width:1.5},symbol:'none',areaStyle:{color:{type:'linear',x:0,y:0,x2:0,y2:1,colorStops:[{offset:0,color:'rgba(59,130,246,.15)'},{offset:1,color:'rgba(59,130,246,0)'}]}},
           markPoint:{data:[...buyPts,...sellPts]}},
          {name:'VWAP',type:'line',data:vwaps,xAxisIndex:0,yAxisIndex:0,lineStyle:{color:'#f5b942',type:'dashed',width:1},symbol:'none'},
          {name:'成交量',type:'bar',data:vols,xAxisIndex:1,yAxisIndex:1,itemStyle:{color:function(p){return closes[p.dataIndex]>=(closes[p.dataIndex-1]||closes[p.dataIndex])?'rgba(239,68,68,.5)':'rgba(34,197,94,.5)'}}}
        ]
      });
    },100);
  }
}

let trackingData = [];
let trackingFilter = 'all';

async function loadTracking(){
  try{
    const {data}=await sb.from('candidate_tracking').select('*').order('select_date',{ascending:false}).limit(200);
    trackingData=data||[];
  }catch(e){trackingData=[];}
}

function pctCell(val,label){
  if(val==null) return `<div class="stat"><div class="v" style="color:var(--sub)">--</div><div class="l">${label}</div></div>`;
  const c=val>=0?'var(--up)':'var(--down)';
  return `<div class="stat"><div class="v" style="color:${c}">${val>=0?'+':''}${val.toFixed(2)}%</div><div class="l">${label}</div></div>`;
}

function renderReview(){
  const filtered=trackingFilter==='all'?trackingData:trackingData.filter(t=>t.status===trackingFilter);
  const completed=trackingData.filter(t=>t.pct_5d!=null);
  const c10=trackingData.filter(t=>t.pct_10d!=null);
  const c20=trackingData.filter(t=>t.pct_20d!=null);
  const win5=completed.length?completed.filter(t=>t.pct_5d>0).length:0;
  const win10=c10.length?c10.filter(t=>t.pct_10d>0).length:0;
  const win20=c20.length?c20.filter(t=>t.pct_20d>0).length:0;
  const avg5=completed.length?(completed.reduce((s,t)=>s+t.pct_5d,0)/completed.length):0;
  const avg10=c10.length?(c10.reduce((s,t)=>s+t.pct_10d,0)/c10.length):0;
  const avg20=c20.length?(c20.reduce((s,t)=>s+t.pct_20d,0)/c20.length):0;
  const maxG=trackingData.length?Math.max(...trackingData.map(t=>t.max_gain||0)):0;
  const maxL=trackingData.length?Math.min(...trackingData.map(t=>t.max_loss||0)):0;

  // 表现分组：以最长的已有周期为准（20日 > 10日 > 5日 > 当前）
  const perfOf=(t)=>{
    if(t.pct_20d!=null) return {v:t.pct_20d,label:'20日'};
    if(t.pct_10d!=null) return {v:t.pct_10d,label:'10日'};
    if(t.pct_5d!=null) return {v:t.pct_5d,label:'5日'};
    return {v:t.pct_change||0,label:'当前'};
  };
  const good=[],bad=[],mid=[];
  filtered.forEach(t=>{
    const p=perfOf(t);
    if(t.hit_stop || p.v<=-5) bad.push({t,p});
    else if(p.v>=5) good.push({t,p});
    else mid.push({t,p});
  });
  good.sort((a,b)=>b.p.v-a.p.v);
  bad.sort((a,b)=>a.p.v-b.p.v);

  const filterBtns=['all','追踪中','已完成'].map(f=>
    `<span class="tab ${trackingFilter===f?'active':''}" onclick="trackingFilter='${f}';render()" style="font-size:12px;padding:5px 12px">${f==='all'?'全部':f}</span>`
  ).join('');

  const statusTag=(t)=>{
    if(t.hit_stop) return '<span class="badge risk">触及止损</span>';
    if(t.hit_target>=3) return '<span class="badge buy">达目标3</span>';
    if(t.hit_target>=2) return '<span class="badge buy">达目标2</span>';
    if(t.hit_target>=1) return '<span class="badge watch">达目标1</span>';
    if(t.status==='已完成') return '<span class="badge" style="background:var(--card2);color:var(--sub);border:1px solid var(--border)">已完成</span>';
    return '<span class="badge watch">追踪中</span>';
  };

  const card=(o)=>{
    const t=o.t, p=o.p;
    const pct=t.pct_change||0;
    const pc=pct>=0?'up':'down';
    const gcol=p.v>=5?'var(--up)':p.v<=-5?'var(--down)':'var(--sub)';
    return `<div class="card" style="border-left:3px solid ${p.v>=5?'var(--up)':p.v<=-5?'var(--down)':'var(--border)'}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name">${t.name||t.code} <span class="stock-code">${t.code}</span></div>
          <div class="stock-code">入选 ${t.select_date} · 分数 ${t.select_score} · ${p.label} <b style="color:${gcol}">${p.v>=0?'+':''}${p.v.toFixed(2)}%</b></div>
          <div style="margin-top:4px">${getConcepts(t.code)}</div>
        </div>
        <div style="text-align:right">
          <div class="${pc}" style="font-size:18px;font-weight:700">${pct>=0?'+':''}${pct.toFixed(2)}%</div>
          ${statusTag(t)}
        </div>
      </div>
      <div class="stat-grid" style="margin-top:10px">
        ${pctCell(t.pct_5d,'5日')}
        ${pctCell(t.pct_10d,'10日')}
        ${pctCell(t.pct_20d,'20日')}
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--sub)">
        <span>入选价 ${fmt(t.select_price)} → 当前 ${fmt(t.current_price)}</span>
        <span>最大涨 <b class="up">${(t.max_gain||0).toFixed(1)}%</b> 最大跌 <b class="down">${(t.max_loss||0).toFixed(1)}%</b></span>
      </div>
    </div>`;};

  const group=(title,list,color,tip)=>{
    if(!list.length) return '';
    return `<div class="card" style="border-color:${color}">
      <div class="card-title"><div class="t"><span class="dot" style="background:${color}"></span>${title}</div><span class="sub">${list.length} 只</span></div>
      <div class="sub" style="margin-bottom:8px">${tip}</div>
      ${list.map(card).join('')}
    </div>`;};

  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>策略效果统计</div><span class="sub">共${trackingData.length}只</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${completed.length?Math.round(win5/completed.length*100):0}%</div><div class="l">5日胜率(${win5}/${completed.length})</div></div>
        <div class="stat"><div class="v">${c10.length?Math.round(win10/c10.length*100):0}%</div><div class="l">10日胜率(${win10}/${c10.length})</div></div>
        <div class="stat"><div class="v">${c20.length?Math.round(win20/c20.length*100):0}%</div><div class="l">20日胜率(${win20}/${c20.length})</div></div>
      </div>
      <div class="stat-grid" style="margin-top:8px">
        <div class="stat"><div class="v ${avg5>=0?'up':'down'}">${avg5>=0?'+':''}${avg5.toFixed(2)}%</div><div class="l">平均5日</div></div>
        <div class="stat"><div class="v ${avg10>=0?'up':'down'}">${avg10>=0?'+':''}${avg10.toFixed(2)}%</div><div class="l">平均10日</div></div>
        <div class="stat"><div class="v ${avg20>=0?'up':'down'}">${avg20>=0?'+':''}${avg20.toFixed(2)}%</div><div class="l">平均20日</div></div>
      </div>
      <div class="stat-grid" style="margin-top:8px">
        <div class="stat"><div class="v up">+${maxG.toFixed(1)}%</div><div class="l">最大盈利</div></div>
        <div class="stat"><div class="v down">${maxL.toFixed(1)}%</div><div class="l">最大亏损</div></div>
        <div class="stat"><div class="v">${trackingData.filter(t=>t.status==='追踪中').length}</div><div class="l">追踪中</div></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin:10px 0;flex-wrap:wrap">${filterBtns}</div>
    ${group('优质标的（涨幅 ≥ +5%）',good,'var(--up)','这些票验证了选股逻辑有效，可复盘它们的共同概念、量价特征')}
    ${group('劣质标的（跌幅 ≤ -5% 或触及止损）',bad,'var(--down)','这些票是策略失效样本，回看它们入选时的形态，用于收紧选股条件')}
    ${group('中性 / 观察中',mid,'var(--sub)','涨跌幅在 ±5% 之间，或尚未走完观察周期')}
    <div class="notice">⚠️ 复盘结论用于调整选股阈值与参数，仅供研究参考</div>`;
}

async function loadTSignals(){
  try{
    const {data:dateRows}=await sb.from('t_strategy').select('trade_date').order('trade_date',{ascending:false}).limit(1);
    if(!dateRows||!dateRows.length) return;
    const latest=dateRows[0].trade_date;
    const {data}=await sb.from('t_strategy').select('*').eq('trade_date',latest);
    tSignals={};
    (data||[]).forEach(t=>{tSignals[t.code]=mergeTExtra(t);});
  }catch(e){console.error('加载做T信号失败:',e);}
}

let tExtra = {};

async function loadTExtra(){
  try{
    const {data,error}=await sb.from('config').select('key,value');
    if(error) return;
    (data||[]).forEach(r=>{
      const k=r.key||'';
      if(!k.startsWith('tstr:')) return;
      const code=k.split(':')[1];
      tExtra[code]=safeParse(r.value,{});
    });
  }catch(e){console.error('加载做T附加信息失败:',e);}
}

async function loadConcepts(){
  try{
    const {data,error}=await sb.from('config').select('key,value');
    if(error){console.error('加载概念失败:',error);return;}
    (data||[]).forEach(r=>{
      const k=r.key||'';
      if(!k.startsWith('concepts:')) return;
      const code=k.split(':')[1];
      const payload=safeParse(r.value,{});
      const v=payload&&payload.concepts?payload.concepts:[];
      conceptMap[code]=Array.isArray(v)?v:[];
    });
  }catch(e){console.error('加载概念失败:',e);}
}

function getConcepts(code){
  const c=conceptMap[code]||[];
  return c.slice(0,6).map(x=>`<span class="badge" style="background:rgba(56,189,248,.12);color:#38bdf8;border:1px solid rgba(56,189,248,.25);font-size:11px">${x}</span>`).join(' ');
}

let backtestData = {};

async function loadBacktest(){
  try{
    const {data,error}=await sb.from('config').select('key,value');

async function addWatchStock(){
  const inp=document.getElementById('wl-input');
  const val=(inp?.value||'').trim();
  if(!val){alert('请输入股票代码或名称');return;}
  const code=val.replace(/[^0-9]/g,'');
  if(code.length!==6){alert('请输入6位股票代码');return;}
  try{
    const {data:exist}=await sb.from('watchlist').select('code').eq('code',code);
    if(exist&&exist.length){alert('该股票已在自选股中');return;}
    let name=val;
    const {data:stock}=await sb.from('stocks').select('name').eq('code',code);
    if(stock&&stock.length) name=stock[0].name;
    await sb.from('watchlist').insert({code,name});
    await loadWatchlist();
    go('watchlist');
  }catch(e){alert('添加失败: '+e.message);}
}

async function removeWatchStock(code){
  try{
    await sb.from('watchlist').delete().eq('code',code);
    delete watchScores[code];
    await loadWatchlist();
    go('watchlist');
  }catch(e){alert('删除失败: '+e.message);}
}

function gradeColor(g){
  if(g==='强烈关注')return 'var(--up)';
  if(g==='关注')return 'var(--gold)';
  if(g==='中性')return 'var(--sub)';
  return 'var(--down)';
}

    return `<div class="card">

        <input id="wl-input" placeholder="输入6位股票代码，如 600519" style="flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;outline:none">
        <button onclick="addWatchStock()" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer">添加</button>
      </div>
      <div class="loading" style="padding:20px">暂无自选股，添加后每日自动分析评分</div>

  }
  const items=watchlist.map(w=>{

    const score=s?s.score:'--';
    const grade=s?s.grade:'待分析';
    const sigs=s?safeParse(s.signals,[]):[];
    const dims=s?safeParse(s.dims,{}):{};
    const dimBars=Object.entries(dims).map(([name,d])=>{
      const pct=Math.round(d.raw/d.max*100);
      return `<div style="margin-top:6px">
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:var(--sub)">${name} <span style="opacity:.6">(权重${d.weight}%)</span></span>
          <span style="color:${pct>=60?'var(--up)':pct>=30?'var(--gold)':'var(--down)'}">${d.raw}/${d.max}</span>
        </div>
        <div class="progress"><i style="width:${pct}%"></i></div>
      </div>`;}).join('');
    const dimReasons=Object.entries(dims).flatMap(([name,d])=>
      d.reasons.map(r=>`<div style="font-size:11px;color:var(--sub);margin-top:2px">· <b>${name}</b>: ${r}</div>`)
    ).join('');
    const t = tSignals[w.code] ? normalizeTData(tSignals[w.code]) : null;
    const tBadge = t ? `<span class="badge" style="background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)">做T ${t.advice}</span>` : '';
    return `<div class="card" onclick="selectStock('${w.code}');go('analysis')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name">${w.name||w.code} ${tBadge}</div>
          <div class="stock-code">${w.code}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="text-align:center">
            <div style="font-size:22px;font-weight:700;color:${s?gradeColor(s.grade):'var(--sub)'}">${score}</div>
            <div style="font-size:10px;color:${s?gradeColor(s.grade):'var(--sub)'}">${grade}</div>
          </div>
          <button onclick="event.stopPropagation();removeWatchStock('${w.code}')" style="background:none;border:1px solid var(--border);color:var(--sub);border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer">删除</button>
        </div>
      </div>
      ${s?`<div class="progress" style="margin-top:8px"><i style="width:${Math.min(s.score,100)}%"></i></div>`:''}
      ${s&&s.summary?`<div style="font-size:11px;color:var(--gold);margin-top:8px;padding:8px;background:var(--card2);border-radius:8px">${s.summary}</div>`:''}
      ${dimBars}
      <details style="margin-top:8px" onclick="event.stopPropagation()">
        <summary style="font-size:12px;color:var(--brand);cursor:pointer">查看评分依据明细</summary>
        <div style="margin-top:6px">${dimReasons||'<span style="font-size:11px;color:var(--sub)">暂无明细</span>'}</div>
      </details>
    </div>`;}).join('');
  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>自选股（${watchlist.length}只）</div></div>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input id="wl-input" placeholder="输入6位股票代码，如 600519" style="flex:1;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 14px;font-size:14px;outline:none">
        <button onclick="addWatchStock()" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer">添加</button>
      </div>
    </div>
    ${items}
    <div class="notice">评分每天自动更新 · 点击K线页面查看详细分析</div>`;
}

function selectStock(code){
  selectedStock = candidates.find(c=>c.code===code)||null;
  if(!selectedStock){
    const t = tSignals[code];
    const w = watchlist.find(x=>x.code===code);
    const s = watchScores[code];
    selectedStock = {code, name:(t&&t.name)||(w&&w.name)||(s&&s.name)||code,
      score:s?s.score:null, last_price:null,
      launch_point:null, stop_loss:null, target_1:null, target_2:null, target_3:null};
  }
}

// 做T信号页
function tAdviceBadge(advice){
  if(!advice) return '';
  const buy = advice.includes('买入');
  const sell = advice.includes('卖出');
  const color = buy?'var(--up)':sell?'var(--down)':'var(--sub)';
  const bg = buy?'rgba(239,68,68,.15)':sell?'rgba(34,197,94,.15)':'rgba(124,141,181,.15)';
  const border = buy?'rgba(239,68,68,.3)':sell?'rgba(34,197,94,.3)':'rgba(124,141,181,.3)';
  return `<span class="badge" style="background:${bg};color:${color};border:1px solid ${border}">${advice}</span>`;
}

function renderTSignals(){
  const norm=Object.values(tSignals).map(t=>{
    const n=normalizeTData(t);
    let plan=t.plan;
    plan=safeParse(plan,null);
    return {code:t.code,name:t.name,trade_date:t.trade_date,industry:t.industry,
      advice:n.advice,confidence:n.confidence,vwap:n.vwap,signals:n.signals,
      period:t.period||'30',plan:plan,buy_score:t.buy_score||0,sell_score:t.sell_score||0};
  });
  const list=norm.sort((a,b)=>{
    const ba=(a.advice.includes('买入')?2:0)+(a.confidence==='高'?1:0);
    const bb=(b.advice.includes('买入')?2:0)+(b.confidence==='高'?1:0);
    return bb-ba;
  });
  if(!list.length){
    return `<div class="loading">暂无做T信号数据<br><span class="sub">等待交易日脚本运行后生成</span></div>`;
  }
  const items=list.map(t=>{
    const signals=t.signals||[];
    const buys=signals.filter(s=>s.type==='买入');
    const sells=signals.filter(s=>s.type==='卖出');
    const lastReason=(signals[signals.length-1]||{}).reason||'';
    return `<div class="card" onclick="selectStock('${t.code}');go('analysis')" style="cursor:pointer">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="stock-name">${t.name||t.code} <span class="stock-code">${t.code}</span></div>
          <div class="stock-code">VWAP ${fmt(t.vwap)} · ${t.industry||'未知行业'} · ${t.period}分钟周期</div>
          <div style="margin-top:4px">${getConcepts(t.code)}</div>
        </div>
        <div style="text-align:right">
          ${tAdviceBadge(t.advice)}
          <div class="stock-code" style="margin-top:4px">置信度 ${t.confidence}</div>
        </div>
      </div>
      <div class="stat-grid" style="margin-top:10px">
        <div class="stat"><div class="v up">${t.buy_score}</div><div class="l">买入强度分</div></div>
        <div class="stat"><div class="v down">${t.sell_score}</div><div class="l">卖出强度分</div></div>
        <div class="stat"><div class="v" style="font-size:13px;color:var(--sub);line-height:1.5">${lastReason.slice(0,14)}</div><div class="l">最新信号</div></div>
      </div>
      ${t.plan&&t.plan.entry?`<div style="margin-top:8px;font-size:12px;color:var(--sub)">触发 <b style="color:var(--text)">${fmt(t.plan.entry)}</b> · 止损 <b class="down">${fmt(t.plan.stop)}</b> · 目标 <b class="up">${fmt(t.plan.target)}</b> · 仓位 ${t.plan.position||'-'}</div>`:''}
    </div>`;
  }).join('');
  return `
    <div class="card" style="border-color:rgba(139,92,246,.4)">
      <div class="card-title"><div class="t"><span class="dot" style="background:var(--purple);box-shadow:0 0 8px var(--purple)"></span>日内做T信号</div><span class="badge" style="background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3)">${list.length}只</span></div>
      <div class="sub">基于30分钟K线的VWAP/量能/MACD/KDJ/布林带/板块联动标准化信号（强=2分 中=1分，同向≥3分视为共振），点击卡片查看K线图与做T计划</div>
    </div>
    ${items}
    <div class="notice">⚠️ 日内做T仅供参考，注意仓位管理和交易成本</div>`;
}

const CONFIG_FIELDS = [
  {key:'min_change_pct',label:'启动涨幅阈值(%)',options:[{v:3,l:'3% (宽松)'},{v:5,l:'5% (适中)'},{v:7,l:'7% (默认)'},{v:9,l:'9% (严格)'}],def:7},
  {key:'volume_ratio',label:'量能倍数',options:[{v:1.5,l:'1.5倍'},{v:2,l:'2倍 (默认)'},{v:3,l:'3倍'}],def:2},
  {key:'shrink_ratio',label:'缩量比例',options:[{v:0.8,l:'80% (宽松)'},{v:0.6,l:'60% (默认)'},{v:0.5,l:'50% (严格)'}],def:0.6},
  {key:'pullback_tolerance',label:'回踩容忍度',options:[{v:0.95,l:'跌5% (宽松)'},{v:0.97,l:'跌3% (适中)'},{v:0.99,l:'跌1% (默认)'}],def:0.99},
  {key:'ma5_deviation',label:'MA5偏离度',options:[{v:0.08,l:'8% (宽松)'},{v:0.05,l:'5% (适中)'},{v:0.03,l:'3% (默认)'}],def:0.03},
  {key:'min_score',label:'最低入选分数',options:[{v:30,l:'30分'},{v:40,l:'40分'},{v:50,l:'50分'},{v:60,l:'60分 (默认)'},{v:70,l:'70分'}],def:60},
];
let currentConfig = {};

async function loadConfig(){
  try{
    const {data}=await sb.from('config').select('*').eq('key','thresholds');
    if(data&&data[0]&&data[0].value){
      const val=safeParse(data[0].value,null);
      return val;
    }
    return {};
  }catch(e){return {};}
}

async function saveConfig(){
  const cfg={};
  CONFIG_FIELDS.forEach(f=>{
    const el=document.getElementById('cfg_'+f.key);
    cfg[f.key]=el?parseFloat(el.value):f.def;
  });
  try{
    await sb.from('config').upsert({key:'thresholds',value:cfg},{onConflict:'key'}).select();
    currentConfig=cfg;
    document.getElementById('save-msg').textContent='保存成功！下次选股将使用新参数';
    document.getElementById('save-msg').style.color='var(--brand)';
    setTimeout(()=>{const m=document.getElementById('save-msg');if(m)m.textContent='';},3000);
  }catch(e){
    document.getElementById('save-msg').textContent='保存失败: '+e.message;
    document.getElementById('save-msg').style.color='var(--up)';
  }
}

function renderSettings(){
  const fields=CONFIG_FIELDS.map(f=>{
    const cur=currentConfig[f.key]!=null?currentConfig[f.key]:f.def;
    const opts=f.options.map(o=>`<option value="${o.v}" ${Number(cur)===Number(o.v)?'selected':''}>${o.l}</option>`).join('');
    return `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span class="sub" style="font-size:13px">${f.label}</span>
      <select id="cfg_${f.key}" style="background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;outline:none">${opts}</select>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>选股参数配置</div><span class="sub">调整后下次选股生效</span></div>
      ${fields}
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <button onclick="saveConfig()" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">保存配置</button>
        <span id="save-msg" style="font-size:12px"></span>
      </div>
    </div>
    <div class="notice">修改参数后需手动触发 GitHub Actions 或等待每日自动运行<br>参数越宽松，候选股票越多，但信号质量可能降低</div>`;
}

function btCell(c){
  if(!c||!c.n) return '<div class="sub">--</div>';
  const wr=c.win_rate>=50?'var(--up)':'var(--down)';
  return `<div class="stat"><div class="v ${c.avg>=0?'up':'down'}">${c.avg>=0?'+':''}${c.avg}%</div><div class="l">胜率 <b style="color:${wr}">${c.win_rate}%</b> · ${c.n}次</div></div>`;
}

function renderBacktest(){
  const t=backtestData['t_signal'];
  const s=backtestData['screening'];
  if(!t&&!s){
    return `<div class="loading">暂无回测数据<br><span class="sub">等待脚本运行后生成（需要先积累几天信号样本）</span></div>`;
  }

  const hLabel={h1:'后1根(30分钟)',h3:'后3根(1.5小时)',h6:'后6根(3小时)'};
  const sLabel={h5:'入选后5日',h10:'入选后10日',h20:'入选后20日'};

  let tHtml='<div class="sub">暂无做T信号回测数据</div>';
  if(t&&t.samples){
    const all=t.groups['全部']||{};
    const byInd=t.groups['指标']||{};
    const indRows=Object.entries(byInd).sort((a,b)=>(b[1].h3?.n||0)-(a[1].h3?.n||0)).map(([k,v])=>`
      <div class="card" style="background:var(--card2)">
        <div style="display:flex;justify-content:space-between"><b style="font-size:13px">${k}</b><span class="sub">${v.h3?`${v.h3.n}次` : (v.h1?`${v.h1.n}次`:'')}</span></div>
        <div class="stat-grid" style="margin-top:6px">
          ${btCell(v.h1)}${btCell(v.h3)}${btCell(v.h6)}
        </div>
      </div>`).join('');
    tHtml=`
      <div class="card" style="border-color:rgba(34,197,94,.35)">
        <div class="card-title"><div class="t"><span class="dot" style="background:var(--up)"></span>做T信号回测</div><span class="sub">${t.samples}个信号 · 成本${t.cost}%</span></div>
        <div class="sub" style="margin-bottom:8px">统计每个信号发出后，价格在 1/3/6 根30分钟K线内的净收益（已扣交易成本），胜率=扣除成本后方向正确占比</div>
        <div class="stat-grid">
          ${btCell(all.h1)}${btCell(all.h3)}${btCell(all.h6)}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><div class="t"><span class="dot"></span>分指标表现</div><span class="sub">看哪个指标最准</span></div>
        ${indRows||'<div class="sub">样本不足</div>'}
      </div>`;
  }

  let sHtml='<div class="sub">暂无选股回测数据</div>';
  if(s&&s.samples){
    const groups=s.groups||{};
    const keys=Object.keys(groups).filter(k=>k!=='全部');
    const rows=keys.map(k=>{
      const v=groups[k];
      return `<tr><td style="padding:6px 8px;font-size:12px">${k}</td>
        <td style="padding:6px 8px;text-align:right">${v.h5?v.h5.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h5&&v.h5.win_rate>=50?'var(--up)':'var(--down)'}">${v.h5?v.h5.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right">${v.h10?v.h10.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h10&&v.h10.win_rate>=50?'var(--up)':'var(--down)'}">${v.h10?v.h10.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right">${v.h20?v.h20.n:'--'}</td>
        <td style="padding:6px 8px;text-align:right;color:${v.h20&&v.h20.win_rate>=50?'var(--up)':'var(--down)'}">${v.h20?v.h20.win_rate+'%':'--'}</td>
        <td style="padding:6px 8px;text-align:right" class="${v.h20&&v.h20.avg>=0?'up':'down'}">${v.h20?v.h20.avg+'%':'--'}</td></tr>`;
    }).join('');
    const all=groups['全部']||{};
    sHtml=`
      <div class="card" style="border-color:rgba(56,189,248,.35)">
        <div class="card-title"><div class="t"><span class="dot" style="background:#38bdf8"></span>选股策略回测</div><span class="sub">${s.samples}只 · 成本${s.cost}%</span></div>
        <div class="stat-grid">
          ${btCell(all.h5)}${btCell(all.h10)}${btCell(all.h20)}
        </div>
      </div>
      <div class="card">
        <div class="card-title"><div class="t"><span class="dot"></span>分组表现</div><span class="sub">找出最优参数区间</span></div>
        <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="color:var(--sub);font-size:11px">
            <th style="text-align:left;padding:6px 8px">分组</th>
            <th style="text-align:right;padding:6px 8px">5日样本</th>
            <th style="text-align:right;padding:6px 8px">5日胜率</th>
            <th style="text-align:right;padding:6px 8px">10日样本</th>
            <th style="text-align:right;padding:6px 8px">10日胜率</th>
            <th style="text-align:right;padding:6px 8px">20日样本</th>
            <th style="text-align:right;padding:6px 8px">20日胜率</th>
            <th style="text-align:right;padding:6px 8px">20日均值</th>
          </tr></thead>
          <tbody>${rows||'<tr><td colspan="8" class="sub">样本不足</td></tr>'}</tbody>
        </table>
        </div>
        <div class="sub" style="margin-top:8px">分组维度：入选当日涨幅区间 / 评分区间 / 回踩天数 / 所属概念。样本 ≥20 的分组才可信。</div>
      </div>`;
  }

  return `
    ${tHtml}
    ${sHtml}
    <div class="notice">⚠️ 回测基于实际信号的前瞻统计，不含未来函数；样本量小于30时胜率波动很大，仅供调参参考</div>`;
}

function renderBanner(){
  if(!lastRun) return '';
  const stale=lastRun.stale;
  const bg=stale?'rgba(239,68,68,.12)':'rgba(34,197,94,.12)';
  const color=stale?'#ef4444':'#22c55e';
  const bd=stale?'rgba(239,68,68,.3)':'rgba(34,197,94,.3)';
  const candDate=(candidates&&candidates[0]&&candidates[0].trade_date)||lastRun.data_date;
  return `<div class="card" style="border-color:${bd};background:${bg}">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
      <div style="font-size:13px">
        <b style="color:${color}">数据日期 ${lastRun.data_date||'未知'}</b>
        ${stale?`<span class="sub" style="margin-left:8px">⚠️ 行情源未更新到 ${lastRun.today}，页面数据可能仍是上一交易日的</span>`
               :`<span class="sub" style="margin-left:8px">已是最新</span>`}
      </div>
      <div class="sub">上次运行 ${lastRun.run_at||'-'} · 候选 ${lastRun.candidates||0} 只 · 抓取 ${lastRun.fetched||0}/${lastRun.pool||0}</div>
    </div>
  </div>`;
}

async function render(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  document.querySelectorAll('#tabbar div').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  const v = document.getElementById('view');
  const banner=renderBanner();
  if(cur==='radar') v.innerHTML = banner+renderRadar();
  else if(cur==='watchlist') v.innerHTML = banner+renderWatchlist();
  else if(cur==='tsignals') v.innerHTML = banner+renderTSignals();
  else if(cur==='analysis'){ v.innerHTML = banner+renderAnalysis(); setTimeout(initKline,50); setTimeout(renderTStrategy,200); }
  else if(cur==='review') v.innerHTML = banner+renderReview();
  else if(cur==='backtest') v.innerHTML = banner+renderBacktest();
  else if(cur==='settings') v.innerHTML = banner+renderSettings();
  window.scrollTo(0,0);
}
function go(id){ cur=id; render(); }

async function init(){
  document.getElementById('tabs').innerHTML = VIEWS.map(v=>`<div class="tab" data-id="${v.id}" onclick="go('${v.id}')">${v.name}</div>`).join('');
  document.getElementById('tabbar').innerHTML = VIEWS.map(v=>`<div data-id="${v.id}" onclick="go('${v.id}')"><span class="ic">${v.icon}</span>${v.name}</div>`).join('');
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).slice(5,16);}
  setInterval(tick,1000);tick();
  document.getElementById('view').innerHTML='<div class="loading">正在加载数据...</div>';
  currentConfig = await loadConfig();
  await loadLastRun();
  await loadBacktest();
  await loadConcepts();
  await loadWatchlist();
  await loadTExtra();
  await loadTSignals();
  await loadTracking();
  await loadSignals();
  candidates = await loadCandidates();
  if(candidates.length) selectedStock = candidates[0];
  render();
  window.addEventListener('resize',()=>klineChart&&klineChart.resize());
}
init();
</script>
