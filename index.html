<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>A股埋伏追踪终端</title>
<script src="https://cdn.staticfile.org/echarts/5.4.3/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e17;--card:#131a29;--card2:#182135;--border:#1e2a42;
  --text:#e5edff;--sub:#7c8db5;--up:#ef4444;--down:#22c55e;
  --brand:#3b82f6;--gold:#f5b942;--purple:#8b5cf6;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;padding-bottom:70px}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg,#101830,#0a0e17);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:8px}
.logo span{color:var(--brand)}
.sub{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:56px;z-index:9;
  background:rgba(10,14,23,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 14px;border-radius:20px;background:var(--card);color:var(--sub);white-space:nowrap;font-size:13px;border:1px solid transparent;transition:.2s;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border-color:#3b82f6}
main{padding:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px;justify-content:space-between}
.card-title .t{display:flex;align-items:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.idx{background:var(--card2);border-radius:12px;padding:12px;border:1px solid var(--border)}
.idx .n{font-size:12px;color:var(--sub);margin-bottom:6px}
.idx .p{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.idx .c{font-size:12px;margin-top:3px}
.up{color:var(--up)}.down{color:var(--down)}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(30,42,66,.5)}
.row:last-child{border-bottom:none}
.rank{width:22px;height:22px;border-radius:6px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub)}
.rank.top{background:linear-gradient(135deg,#b45309,#f59e0b);color:#fff}
.stock-name{font-weight:600}
.stock-code{font-size:11px;color:var(--sub);margin-top:2px}
.badge{padding:2px 9px;border-radius:8px;font-size:11px;font-weight:600}
.badge.buy{background:rgba(239,68,68,.15);color:#ff6b6b;border:1px solid rgba(239,68,68,.3)}
.badge.watch{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.badge.risk{background:rgba(245,185,66,.15);color:var(--gold);border:1px solid rgba(245,185,66,.3)}
.score{font-size:18px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.score-l{font-size:10px;color:var(--sub);text-align:center}
.progress{height:5px;background:var(--card2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.plan{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.plan span{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--card2);color:var(--sub)}
.plan span b{font-weight:600}
#kline{width:100%;height:260px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:11px;color:var(--sub);margin-top:3px}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(13,18,30,.96);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;padding:6px 0 max(6px,env(safe-area-inset-bottom));z-index:20}
.tabbar div{flex:1;text-align:center;color:var(--sub);font-size:10px;padding:4px 0;cursor:pointer}
.tabbar div.active{color:var(--brand)}
.tabbar .ic{font-size:19px;display:block;margin-bottom:2px}
.notice{font-size:11px;color:var(--sub);text-align:center;padding:14px;line-height:1.6}
.loading{text-align:center;padding:40px;color:var(--sub)}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">📊 A股<span>埋伏追踪</span></div>
    <div class="sub">价格低位 · 企稳吸筹 · 启动确认</div>
  </div>
  <div class="sub" id="clock"></div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="view"></main>
<nav class="tabbar" id="tabbar"></nav>

<script>
const SUPABASE_URL = 'https://iysjcbrximwjpzprixgp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_LpBmLforAdtG7CWW2e9BbQ_WgV7SsyW';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let cur = 'radar';
let klineChart = null;
let candidates = [];
let selectedStock = null;

function fmt(v,d=2){return Number(v).toFixed(d)}

const VIEWS = [
  {id:'radar',name:'机会雷达',icon:'🎯'},
  {id:'analysis',name:'个股分析',icon:'📈'},
  {id:'review',name:'数据总览',icon:'📊'},
  {id:'settings',name:'选股设置',icon:'⚙️'},
];

async function loadCandidates(){
  const today = new Date().toISOString().slice(0,10);
  const {data,error} = await sb.from('candidates')
    .select('*')
    .order('score',{ascending:false})
    .limit(20);
  if(error){console.error('加载候选失败:',error);return [];}
  return data||[];
}

async function loadKline(code){
  const {data,error} = await sb.from('daily_kline')
    .select('*')
    .eq('code',code)
    .order('trade_date',{ascending:true})
    .limit(60);
  if(error){console.error('加载K线失败:',error);return [];}
  return data||[];
}

function renderRadar(){
  if(!candidates.length) return `<div class="loading">暂无候选股票数据<br><span class="sub">等待交易日选股脚本运行后刷新</span></div>`;
  const items = candidates.map((c,i)=>{
    const pct = c.last_price && c.launch_point ? ((c.last_price-c.launch_point)/c.launch_point*100) : 0;
    return `
    <div class="card" onclick="selectStock('${c.code}');go('analysis')" style="cursor:pointer">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="rank ${i<3?'top':''}">${i+1}</div>
          <div>
            <div class="stock-name">${c.code} <span class="badge buy">埋伏</span></div>
            <div class="stock-code">入场 ${fmt(c.launch_point)} · 止损 ${fmt(c.stop_loss)}</div>
          </div>
        </div>
        <div style="text-align:center">
          <div class="score">${fmt(c.score,0)}</div>
          <div class="score-l">质量分</div>
        </div>
      </div>
      <div class="progress"><i style="width:${Math.min(c.score,100)}%"></i></div>
      <div class="plan">
        <span>现价 <b class="${pct>=0?'up':'down'}">${fmt(c.last_price)}</b></span>
        <span>目标1 <b class="up">${fmt(c.target_1)}</b></span>
        <span>目标2 <b class="up">${fmt(c.target_2)}</b></span>
        <span>目标3 <b class="up">${fmt(c.target_3)}</b></span>
      </div>
    </div>`;}).join('');
  return `<div class="card-title" style="padding:4px 4px 12px"><div class="t"><span class="dot"></span>机会雷达 · Top ${candidates.length}</div><span class="sub">启动形态确认</span></div>${items}
  <div class="notice">⚠️ 本工具仅供历史数据研究，不构成投资建议</div>`;
}

function renderAnalysis(){
  const c = selectedStock || candidates[0];
  if(!c) return `<div class="loading">请先从机会雷达选择一只股票</div>`;
  return `
    <div class="card">
      <div class="card-title">
        <div class="t"><span class="dot"></span>${c.code}</div>
        <span class="badge buy">埋伏信号</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:10px">
        <div class="up" style="font-size:26px;font-weight:700">${fmt(c.last_price)}</div>
        <div style="text-align:right"><div class="score">${fmt(c.score,0)}</div><div class="score-l">质量分</div></div>
      </div>
      <div id="kline"></div>
    </div>
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>交易计划</div></div>
      <div class="row"><span class="sub">入场点</span><b>${fmt(c.launch_point)}</b></div>
      <div class="row"><span class="sub">止损位</span><b class="down">${fmt(c.stop_loss)}</b></div>
      <div class="row"><span class="sub">目标位1 (+5%)</span><b class="up">${fmt(c.target_1)}</b></div>
      <div class="row"><span class="sub">目标位2 (+10%)</span><b class="up">${fmt(c.target_2)}</b></div>
      <div class="row"><span class="sub">目标位3 (+15%)</span><b class="up">${fmt(c.target_3)}</b></div>
    </div>`;
}

async function initKline(){
  const c = selectedStock || candidates[0];
  if(!c) return;
  const el = document.getElementById('kline');
  if(!el||!window.echarts) return;
  if(klineChart){klineChart.dispose();}
  klineChart = echarts.init(el);
  klineChart.showLoading({text:'加载K线...',color:'#3b82f6',textColor:'#7c8db5',maskColor:'rgba(10,14,23,0.8)'});
  const kdata = await loadKline(c.code);
  klineChart.hideLoading();
  if(!kdata.length){klineChart.setOption({title:{text:'暂无K线数据',left:'center',top:'center',textStyle:{color:'#7c8db5',fontSize:13}}});return;}
  const dates = kdata.map(k=>k.trade_date.slice(5));
  const ohlc = kdata.map(k=>[k.open,k.close,k.low,k.high]);
  klineChart.setOption({
    backgroundColor:'transparent',
    grid:{left:40,right:12,top:16,bottom:44},
    xAxis:{type:'category',data:dates,axisLine:{lineStyle:{color:'#1e2a42'}},axisLabel:{color:'#7c8db5',fontSize:10,interval: Math.floor(dates.length/6)}},
    yAxis:{scale:true,axisLine:{lineStyle:{color:'#1e2a42'}},axisLabel:{color:'#7c8db5',fontSize:10},splitLine:{lineStyle:{color:'#131a29'}}},
    dataZoom:[{type:'inside',xAxisIndex:0,start:30,end:100}],
    series:[{type:'candlestick',data:ohlc,itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'}}]
  });
}

function renderReview(){
  const total = candidates.length;
  const avgScore = total ? (candidates.reduce((s,c)=>s+c.score,0)/total) : 0;
  const high = candidates.filter(c=>c.score>=80).length;
  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>选股数据总览</div><span class="sub">最新一期</span></div>
      <div class="stat-grid">
        <div class="stat"><div class="v">${total}</div><div class="l">候选股票数</div></div>
        <div class="stat"><div class="v" style="color:var(--gold)">${fmt(avgScore,1)}</div><div class="l">平均质量分</div></div>
        <div class="stat"><div class="v up">${high}</div><div class="l">高分(≥80)</div></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>候选列表</div></div>
      ${candidates.map((c,i)=>`
        <div class="row" onclick="selectStock('${c.code}');go('analysis')" style="cursor:pointer">
          <div style="display:flex;align-items:center;gap:10px">
            <div class="rank ${i<3?'top':''}">${i+1}</div>
            <div><div class="stock-name">${c.code}</div><div class="stock-code">入场${fmt(c.launch_point)} 止损${fmt(c.stop_loss)}</div></div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:600">${fmt(c.last_price)}</div>
            <div class="score" style="font-size:14px">${fmt(c.score,0)}分</div>
          </div>
        </div>`).join('')}
    </div>
    <div class="notice">⚠️ 数据来源于每日自动选股，仅供研究参考</div>`;
}

function selectStock(code){
  selectedStock = candidates.find(c=>c.code===code)||null;
}

const CONFIG_FIELDS = [
  {key:'min_change_pct',label:'启动涨幅阈值(%)',options:[{v:3,l:'3% (宽松)'},{v:5,l:'5% (适中)'},{v:7,l:'7% (默认)'},{v:9,l:'9% (严格)'}],def:7},
  {key:'volume_ratio',label:'量能倍数',options:[{v:1.5,l:'1.5倍'},{v:2,l:'2倍 (默认)'},{v:3,l:'3倍'}],def:2},
  {key:'shrink_ratio',label:'缩量比例',options:[{v:0.8,l:'80% (宽松)'},{v:0.6,l:'60% (默认)'},{v:0.5,l:'50% (严格)'}],def:0.6},
  {key:'pullback_tolerance',label:'回踩容忍度',options:[{v:0.95,l:'跌5% (宽松)'},{v:0.97,l:'跌3% (适中)'},{v:0.99,l:'跌1% (默认)'}],def:0.99},
  {key:'ma5_deviation',label:'MA5偏离度',options:[{v:0.08,l:'8% (宽松)'},{v:0.05,l:'5% (适中)'},{v:0.03,l:'3% (默认)'}],def:0.03},
  {key:'min_score',label:'最低入选分数',options:[{v:30,l:'30分'},{v:40,l:'40分'},{v:50,l:'50分'},{v:60,l:'60分 (默认)'},{v:70,l:'70分'}],def:60},
];
let currentConfig = {};

async function loadConfig(){
  try{
    const {data}=await sb.from('config').select('*').eq('key','thresholds');
    if(data&&data[0]&&data[0].value){
      const val=typeof data[0].value==='string'?JSON.parse(data[0].value):data[0].value;
      return val;
    }
    return {};
  }catch(e){return {};}
}

async function saveConfig(){
  const cfg={};
  CONFIG_FIELDS.forEach(f=>{
    const el=document.getElementById('cfg_'+f.key);
    cfg[f.key]=el?parseFloat(el.value):f.def;
  });
  try{
    await sb.from('config').upsert({key:'thresholds',value:cfg},{onConflict:'key'}).select();
    currentConfig=cfg;
    document.getElementById('save-msg').textContent='保存成功！下次选股将使用新参数';
    document.getElementById('save-msg').style.color='var(--brand)';
    setTimeout(()=>{const m=document.getElementById('save-msg');if(m)m.textContent='';},3000);
  }catch(e){
    document.getElementById('save-msg').textContent='保存失败: '+e.message;
    document.getElementById('save-msg').style.color='var(--up)';
  }
}

function renderSettings(){
  const fields=CONFIG_FIELDS.map(f=>{
    const cur=currentConfig[f.key]!=null?currentConfig[f.key]:f.def;
    const opts=f.options.map(o=>`<option value="${o.v}" ${Number(cur)===Number(o.v)?'selected':''}>${o.l}</option>`).join('');
    return `<div class="row" style="flex-direction:column;align-items:stretch;gap:6px">
      <span class="sub" style="font-size:13px">${f.label}</span>
      <select id="cfg_${f.key}" style="background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:14px;outline:none">${opts}</select>
    </div>`;
  }).join('');
  return `
    <div class="card">
      <div class="card-title"><div class="t"><span class="dot"></span>选股参数配置</div><span class="sub">调整后下次选股生效</span></div>
      ${fields}
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center">
        <button onclick="saveConfig()" style="background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;border:none;border-radius:10px;padding:10px 24px;font-size:14px;font-weight:600;cursor:pointer">保存配置</button>
        <span id="save-msg" style="font-size:12px"></span>
      </div>
    </div>
    <div class="notice">修改参数后需手动触发 GitHub Actions 或等待每日自动运行<br>参数越宽松，候选股票越多，但信号质量可能降低</div>`;
}

async function render(){
  document.querySelectorAll('#tabs .tab').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  document.querySelectorAll('#tabbar div').forEach(t=>t.classList.toggle('active',t.dataset.id===cur));
  const v = document.getElementById('view');
  if(cur==='radar') v.innerHTML = renderRadar();
  else if(cur==='analysis'){ v.innerHTML = renderAnalysis(); setTimeout(initKline,50); }
  else if(cur==='review') v.innerHTML = renderReview();
  else if(cur==='settings') v.innerHTML = renderSettings();
  window.scrollTo(0,0);
}
function go(id){ cur=id; render(); }

async function init(){
  document.getElementById('tabs').innerHTML = VIEWS.map(v=>`<div class="tab" data-id="${v.id}" onclick="go('${v.id}')">${v.name}</div>`).join('');
  document.getElementById('tabbar').innerHTML = VIEWS.map(v=>`<div data-id="${v.id}" onclick="go('${v.id}')"><span class="ic">${v.icon}</span>${v.name}</div>`).join('');
  function tick(){document.getElementById('clock').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).slice(5,16);}
  setInterval(tick,1000);tick();
  document.getElementById('view').innerHTML='<div class="loading">正在加载数据...</div>';
  currentConfig = await loadConfig();
  candidates = await loadCandidates();
  if(candidates.length) selectedStock = candidates[0];
  render();
  window.addEventListener('resize',()=>klineChart&&klineChart.resize());
}
init();
</script>
</body>
</html>
