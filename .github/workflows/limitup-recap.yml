name: 全市场涨停复盘

on:
  schedule:
    # 北京时间 15:45 和 18:10，收盘后生成或补充当天复盘
    - cron: '45 7 * * 1-5'
    - cron: '10 10 * * 1-5'
  workflow_dispatch:

jobs:
  build-recap:
    concurrency:
      group: limitup-recap
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt --prefer-binary

      - name: 生成并保存涨停复盘
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: Asia/Shanghai
        run: python scripts/fetch_limitup_recap.py
