name: Daily A股数据抓取

on:
  schedule:
    # 北京时间 15:35（UTC 07:35）收盘后第一次跑：抓当天完整日K + 当天分钟数据
    - cron: '35 7 * * 1-5'
    # 北京时间 18:00（UTC 10:00）再跑一次：补齐晚间更新的行情与复盘数据
    - cron: '0 10 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-and-screen:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install akshare supabase pandas numpy requests

      - name: 运行数据抓取和选股
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STOCK_POOL_MODE: indices
          STOCK_POOL_INDICES: "000300"
          TZ: Asia/Shanghai
        run: |
          python scripts/fetch_daily.py
