name: Daily A股数据抓取

on:
  schedule:
    # 北京时间每天 18:00（UTC 10:00）自动运行
    - cron: '0 10 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  fetch-and-screen:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: 安装依赖
        run: |
          pip install akshare supabase pandas numpy requests
          
      - name: 运行数据抓取和选股
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STOCK_POOL_MODE: indices
          STOCK_POOL_INDICES: "000300"
        run: |
          python scripts/fetch_daily.py
