name: 放量检测与推送

on:
  schedule:
    - cron: '*/15 9-15 * * 1-5'  # 交易时段每15分钟检测一次
  workflow_dispatch:

jobs:
  detect-volume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: 设置 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install supabase akshare requests pandas -q

      - name: 运行放量检测
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python scripts/detect_volume.py
