name: 放量检测与推送

on:
  schedule:
    # GitHub cron 用 UTC。北京时间 08:00-18:00 = UTC 00:00-10:00
    # 高频 cron 在公共仓库会被大量丢弃，用 30 分钟一档提高执行率；
    # 交易时段由脚本内判断（9:15-11:35 / 12:55-15:35，含收盘后缓冲）过滤
    - cron: '*/30 0-9 * * 1-5'
  workflow_dispatch:

jobs:
  detect-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt --prefer-binary

      - name: 运行放量检测
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          # 备用通道（任选其一即可，无需实名认证）
          SCT_SENDKEY: ${{ secrets.SCT_SENDKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_TO: ${{ secrets.SMTP_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          TZ: Asia/Shanghai
          # 手动触发时跳过交易时段限制，便于测试
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/detect_volume.py
