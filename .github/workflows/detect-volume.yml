name: 放量检测与推送

on:
  schedule:
    # GitHub cron 用 UTC。北京时间 08:00-18:00 = UTC 00:00-10:00
    # 定时任务经常延迟几十分钟，所以放宽窗口，由脚本内的交易时段判断（9:30-11:30 / 13:00-15:00）过滤
    - cron: '*/15 0-9 * * 1-5'
  workflow_dispatch:

jobs:
  detect-volume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt --prefer-binary

      - name: 运行放量检测
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
          # 手动触发时跳过交易时段限制，便于测试
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python scripts/detect_volume.py
